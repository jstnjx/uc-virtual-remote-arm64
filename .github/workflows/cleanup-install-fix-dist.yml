name: Clean install-fix dist artifacts

on:
  push:
    branches:
      - fix/registry-build-and-upload

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/registry-build-and-upload
          fetch-depth: 0
      - name: Restore generated bundle and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- web-configurator/dist
          git rm -f .github/workflows/cleanup-install-fix-dist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore generated configurator bundle"
          git push origin HEAD:fix/registry-build-and-upload
