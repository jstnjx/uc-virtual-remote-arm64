name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-v01416:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/v0.14.16-sync-runtime-ux' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/v0.14.16-sync-runtime-ux
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply repair script and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/repair-v01416-sync-runtime-ux.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'")
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          indent = len(workflow[start]) - len(workflow[start].lstrip())
          body = '\n'.join(line[indent:] if line.startswith(' ' * indent) else line for line in workflow[start + 1:end])
          exec(compile(body, 'repair-v01416.py', 'exec'))
          PY
          npm ci
          npm run ci
      - name: Commit clean product change
        run: |
          git checkout origin/main -- .github/workflows/build.yml
          rm -f .github/workflows/repair-v01416-sync-runtime-ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve Sync Mode UX and HAOS integration runtime"
          git push origin HEAD:fix/v0.14.16-sync-runtime-ux

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source checks and tests
        run: npm run ci

  docker-build:
    name: Validate ${{ matrix.platform }} image
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
