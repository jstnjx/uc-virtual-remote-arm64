name: Validate v0.14.11 ARM64 HTTPS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/v0.14.11-arm64-https'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4

      - name: Extract current Bookworm qemu-aarch64-static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ucvr-qemu
          docker run --rm -v /tmp/ucvr-qemu:/out debian:bookworm-slim sh -lc '
            apt-get update >/dev/null &&
            apt-get install -y --no-install-recommends qemu-user-static >/dev/null &&
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static && chmod 0755 /out/qemu-aarch64-static
          '
          sudo chown "$(id -u):$(id -g)" /tmp/ucvr-qemu/qemu-aarch64-static
          /tmp/ucvr-qemu/qemu-aarch64-static --version

      - name: Build ARM64 PyInstaller TLS probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arm64-probe
          cat >/tmp/arm64-probe/probe.py <<'PY'
          import asyncio
          import os
          import socket
          import ssl
          import aiohttp
          import certifi
          from aiohttp.abc import AbstractResolver

          HOST = 'accounts.spotify.com'
          PORT = 443
          IP = os.environ['PROBE_IP']

          print('probe:start', flush=True)
          print(f'probe:random:ok:{len(os.getrandom(32))}', flush=True)
          raw = socket.create_connection((IP, PORT), timeout=10)
          raw.settimeout(10)
          print('probe:tcp:ok', flush=True)
          context = ssl.create_default_context(cafile=certifi.where())
          print('probe:tls:start', flush=True)
          tls = context.wrap_socket(raw, server_hostname=HOST)
          tls.settimeout(10)
          print(f'probe:tls:ok:{tls.version()}:{tls.cipher()[0]}', flush=True)
          tls.sendall(f'GET /authorize HTTP/1.1\r\nHost: {HOST}\r\nConnection: close\r\n\r\n'.encode())
          head = tls.recv(4096)
          print('probe:http:ok:' + head.split(b'\r\n', 1)[0].decode('ascii', 'replace'), flush=True)
          tls.close()

          class StaticResolver(AbstractResolver):
              async def resolve(self, host, port=0, family=socket.AF_INET):
                  return [{
                      'hostname': host,
                      'host': IP,
                      'port': port,
                      'family': socket.AF_INET,
                      'proto': socket.IPPROTO_TCP,
                      'flags': 0,
                  }]
              async def close(self):
                  return None

          async def main():
              timeout = aiohttp.ClientTimeout(total=20, connect=10, sock_connect=10, sock_read=10)
              connector = aiohttp.TCPConnector(ssl=context, resolver=StaticResolver(), family=socket.AF_INET)
              async with aiohttp.ClientSession(connector=connector, timeout=timeout) as session:
                  print('probe:aiohttp:start', flush=True)
                  async with session.get(f'https://{HOST}/authorize', allow_redirects=False) as response:
                      print(f'probe:aiohttp:ok:{response.status}', flush=True)
          asyncio.run(main())
          print('probe:ok', flush=True)
          PY
          docker run --rm --platform linux/arm64 \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v /tmp/arm64-probe:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:3.11.12-0.3.0 \
            bash -lc 'cd /workspace && pyinstaller --clean --onedir --name tls-probe probe.py'

      - name: Extract compatible ARM64 userspace
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 arm64v8/debian:bullseye-slim >/dev/null
          cid="$(docker create --platform linux/arm64 arm64v8/debian:bullseye-slim)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/arm64-rootfs
          docker export "$cid" | tar -C /tmp/arm64-rootfs -xf -

      - name: Require TLS and aiohttp with ARM crypto acceleration disabled
        shell: bash
        env:
          OPENSSL_armcap: '0'
        run: |
          set -euo pipefail
          export PROBE_IP="$(getent ahostsv4 accounts.spotify.com | awk 'NR==1 {print $1}')"
          test -n "$PROBE_IP"
          echo "Using host-resolved Spotify IPv4: $PROBE_IP"
          export _PYI_ARCHIVE_FILE=/tmp/arm64-probe/dist/tls-probe/tls-probe
          export _PYI_PARENT_PROCESS_LEVEL=0
          export LD_LIBRARY_PATH=/tmp/arm64-probe/dist/tls-probe/_internal
          timeout --kill-after=5s 60s \
            /tmp/ucvr-qemu/qemu-aarch64-static -L /tmp/arm64-rootfs \
            /tmp/arm64-probe/dist/tls-probe/tls-probe \
            | tee /tmp/probe.log
          grep -q 'probe:tls:ok:' /tmp/probe.log
          grep -q 'probe:aiohttp:ok:' /tmp/probe.log
          grep -q 'probe:ok' /tmp/probe.log

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run ci
