name: Publish v0.14.7 via PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'repair/v0.14.7-retry'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: eee76876e9127a865fc8b648bd756f856bbf0fa7
      TAG: v0.14.7
      VERSION: 0.14.7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate source
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git show "${SOURCE_SHA}:VERSION" | tr -d '\r\n')" = "$VERSION"
          test "$(git show "${SOURCE_SHA}:package.json" | jq -r .version)" = "$VERSION"
      - name: Create exact tag
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$SOURCE_SHA" ]; then exit 1; fi
          if [ -z "$existing" ]; then
            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
      - name: Dispatch release and Docker publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -nc --arg tag "$TAG" --arg version "$VERSION" '{event_type:"publish-release",client_payload:{tag:$tag,version:$version,major_minor:"0.14",major:"0",stable:"true"}}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - >/dev/null
