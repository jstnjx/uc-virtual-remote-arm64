name: Publish v0.14.7 via PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.head_ref == 'repair/v0.14.7-retry'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: eee76876e9127a865fc8b648bd756f856bbf0fa7
      VERSION: 0.14.7
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v6
        with:
          ref: v0.14.7
          fetch-depth: 0

      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version package.json)" = "$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact v0.14.7 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.7
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-eee7687
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
          provenance: mode=max
          sbom: true

      - name: Verify public multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          manifest="$(docker manifest inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.7)"
          jq -e '([.manifests[]?.platform.architecture] | index("amd64")) != null and ([.manifests[]?.platform.architecture] | index("arm64")) != null' <<<"$manifest" >/dev/null
