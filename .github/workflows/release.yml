name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  repository_dispatch:
    types:
      - publish-release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source checks and tests
        run: npm run ci

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            RELEASE_TAG="${{ github.event.client_payload.tag }}"
            TAG_VERSION="${{ github.event.client_payload.version }}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              echo "This workflow must run for a version tag." >&2
              exit 1
            fi
          fi

          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "archive_root=uc-virtual-remote-$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_ROOT: ${{ steps.version.outputs.archive_root }}
        run: |
          set -euo pipefail

          mkdir -p dist

          git archive \
            --format=zip \
            --prefix="$ARCHIVE_ROOT/" \
            --output="dist/$ARCHIVE_ROOT.zip" \
            HEAD

          git archive \
            --format=tar \
            --prefix="$ARCHIVE_ROOT/" \
            HEAD | gzip -9 > "dist/$ARCHIVE_ROOT.tar.gz"

          (
            cd dist
            sha256sum "$ARCHIVE_ROOT.zip" "$ARCHIVE_ROOT.tar.gz" > SHA256SUMS
          )

      - name: Build release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            RANGE="$PREVIOUS_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$RANGE" \
              | sed -E 's/(^|[[:space:]])@jstnjx([[:space:]]|$)/\1jstnjx\2/g'
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
            fi
          } > dist/RELEASE_NOTES.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: uc-virtual-remote-${{ steps.version.outputs.version }}
          path: |
            dist/uc-virtual-remote-${{ steps.version.outputs.version }}.zip
            dist/uc-virtual-remote-${{ steps.version.outputs.version }}.tar.gz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: UC Virtual Remote ${{ steps.version.outputs.tag }}
          files: |
            dist/uc-virtual-remote-${{ steps.version.outputs.version }}.zip
            dist/uc-virtual-remote-${{ steps.version.outputs.version }}.tar.gz
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          make_latest: ${{ contains(steps.version.outputs.tag, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
