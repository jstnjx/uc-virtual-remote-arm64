name: Publish v0.14.6 once

on:
  push:
    branches:
      - publish/v0.14.6

permissions:
  contents: write

env:
  SOURCE_SHA: e28e6776712ba3cb6d2e09193b32cc090351f0e3
  TAG: v0.14.6
  VERSION: 0.14.6

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show "${SOURCE_SHA}:VERSION" | tr -d '\r\n')" = "${VERSION}"
          test "$(git show "${SOURCE_SHA}:package.json" | jq -r .version)" = "${VERSION}"

      - name: Remove one-shot publisher from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/publish-v0146-once.yml'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Remove temporary v0.14.6 publisher' \
            -f sha="${sha}" \
            -f branch=main >/dev/null

      - name: Create exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$SOURCE_SHA" ]; then
            echo "$TAG already points to $existing instead of $SOURCE_SHA" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${SOURCE_SHA}" >/dev/null
          fi

      - name: Dispatch release and Docker publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -nc \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            '{event_type:"publish-release",client_payload:{tag:$tag,version:$version,major_minor:"0.14",major:"0",stable:"true"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - >/dev/null
