name: Run v0.14.5 runtime patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/dind-pyinstaller-runtime' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/dind-pyinstaller-runtime
          fetch-depth: 0

      - name: Apply runtime fixes
        run: python3 tools/apply-v0145-runtime-fixes.py

      - name: Validate source and tests
        run: |
          npm ci
          npm run ci

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/apply-v0145-runtime-fixes.py
          git add -A
          git commit -m "Fix nested Docker privilege detection and ARM64 helper execution"
          git push origin HEAD:fix/dind-pyinstaller-runtime
