name: Publish exact v0.14.16

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.16-exact'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c15a2851f061777436fdef60c1dcfda6b84adb98
          fetch-depth: 0
      - name: Validate exact source
        run: |
          test "$(cat VERSION)" = "0.14.16"
          test "$(node -p "require('./package.json').version")" = "0.14.16"
          test "$(git rev-parse HEAD)" = "c15a2851f061777436fdef60c1dcfda6b84adb98"
      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.14.16 >/dev/null 2>&1; then
            gh release create v0.14.16 \
              --target c15a2851f061777436fdef60c1dcfda6b84adb98 \
              --title "UC Virtual Remote v0.14.16" \
              --notes "Clarifies Sync Mode synchronization levels and renames the periodic timer to reconciliation; preserves Add Integration search text while discovery starts; and fixes official Home Assistant integration installation on Docker-restricted Home Assistant OS hosts by supervising Unfolded Circle's official architecture-specific release binary with a generated per-instance listener configuration."
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.16
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-c15a285
      - name: Verify anonymous multiarch image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.16 | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
      - name: Remove temporary publisher
        run: |
          git checkout publish/v0.14.16-exact
          rm -f .github/workflows/publish-v01416-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.16 publisher"
          git push origin HEAD:publish/v0.14.16-exact
