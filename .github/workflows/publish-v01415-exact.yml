name: Publish exact v0.14.15

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.15-exact'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8acb03fb4198ab75515c0a5826784a28f6a1fe2
          fetch-depth: 0
      - name: Validate exact source
        run: |
          test "$(cat VERSION)" = "0.14.15"
          test "$(node -p "require('./package.json').version")" = "0.14.15"
          test "$(git rev-parse HEAD)" = "b8acb03fb4198ab75515c0a5826784a28f6a1fe2"
      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.14.15 >/dev/null 2>&1; then
            gh release create v0.14.15 \
              --target b8acb03fb4198ab75515c0a5826784a28f6a1fe2 \
              --title "UC Virtual Remote v0.14.15" \
              --notes "Fixes Sync Mode enablement on Home Assistant OS when nested Docker is unavailable. Sync Mode now uses Automatic installation and retains the Remote Sync GitHub source repository, allowing Docker-capable installs to use the prebuilt GHCR image while HAOS falls back to the supervised Node.js source-process runtime. Custom GHCR definitions can now retain and persist an optional GitHub source repository."
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.15
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-b8acb03
      - name: Verify anonymous multiarch image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.15 | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
      - name: Remove temporary publisher
        run: |
          git checkout publish/v0.14.15-exact
          rm -f .github/workflows/publish-v01415-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.15 publisher"
          git push origin HEAD:publish/v0.14.15-exact
