name: Remove generated install-fix dist files

on:
  push:
    branches:
      - fix/registry-build-and-upload

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/registry-build-and-upload
          fetch-depth: 0
      - name: Remove branch-only bundle files and restore main bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t ADDED < <(git diff --name-only --diff-filter=A origin/main HEAD -- web-configurator/dist)
          if [ "${#ADDED[@]}" -gt 0 ]; then
            git rm -f -- "${ADDED[@]}"
          fi
          git checkout origin/main -- web-configurator/dist
          git rm -f .github/workflows/cleanup-install-fix-dist-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated configurator artifacts"
          git push origin HEAD:fix/registry-build-and-upload
