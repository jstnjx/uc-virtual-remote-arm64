name: Publish exact v0.14.9

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.9-exact'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 2a7968c076be32a23f09d4c4d2785874125edc3f
      TAG: v0.14.9
      VERSION: 0.14.9
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version package.json)" = "$VERSION"

      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$SOURCE_SHA" ]; then
            echo "Existing tag points to $existing, expected $SOURCE_SHA" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "UC Virtual Remote 0.14.9" \
              --notes $'Fixes Home Assistant registry installs when nested Docker is unavailable by using an unprivileged supervised Python/Node source runtime.\n\nRestores Remote Simulator parity by loading all configured profiles and fixing the authenticated event stream used for entity, activity, and profile live updates.'
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.9
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-2a7968c
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker
          provenance: mode=max
          sbom: true

      - name: Verify anonymous multiarch image
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          manifest="$(docker manifest inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.9)"
          jq -e '([.manifests[]?.platform.architecture] | index("amd64")) != null and ([.manifests[]?.platform.architecture] | index("arm64")) != null' <<<"$manifest" >/dev/null

      - name: Remove temporary publisher
        run: |
          set -euo pipefail
          git checkout "${{ github.head_ref }}"
          git pull --ff-only origin "${{ github.head_ref }}"
          rm -f .github/workflows/publish-v0149-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.9 publisher"
          git push origin HEAD:${{ github.head_ref }}
