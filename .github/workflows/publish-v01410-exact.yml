name: Publish exact v0.14.10

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.10-exact'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 4cc530ccdb3f72a9a8efae4596c88c5ee66d6f83
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4cc530ccdb3f72a9a8efae4596c88c5ee66d6f83
          fetch-depth: 0
      - name: Validate exact source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "0.14.10"
          node -e 'const p=require("./package.json"); if(p.version!=="0.14.10") process.exit(1)'
      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v0.14.10 "$SOURCE_SHA"
          git push origin refs/tags/v0.14.10 --force
          if gh release view v0.14.10 >/dev/null 2>&1; then
            gh release edit v0.14.10 --target "$SOURCE_SHA" --title "v0.14.10" --notes-file - <<'EOF'
          Fixes Python integration packaging compatibility on restricted Home Assistant hosts.

          - Registry-backed Python integrations now prefer a package `__main__.py` runtime (`python -m package`) instead of executing an internal `driver.py` implementation file when appropriate.
          - Keeps explicit `python_entrypoint` overrides authoritative and adds the repository root to `PYTHONPATH` for direct-script integrations.
          - Fixes PyInstaller custom-integration tarballs that resolve `driver.json` relative to `bin/driver` by exposing the package-root manifest beside the runtime executable without overwriting package-supplied data.
          - Specifically fixes Spotify installation both from the integration registry and from the ARM64 tarball package on AMD64 Home Assistant hosts.
          EOF
          else
            gh release create v0.14.10 --target "$SOURCE_SHA" --title "v0.14.10" --notes-file - <<'EOF'
          Fixes Python integration packaging compatibility on restricted Home Assistant hosts.

          - Registry-backed Python integrations now prefer a package `__main__.py` runtime (`python -m package`) instead of executing an internal `driver.py` implementation file when appropriate.
          - Keeps explicit `python_entrypoint` overrides authoritative and adds the repository root to `PYTHONPATH` for direct-script integrations.
          - Fixes PyInstaller custom-integration tarballs that resolve `driver.json` relative to `bin/driver` by exposing the package-root manifest beside the runtime executable without overwriting package-supplied data.
          - Specifically fixes Spotify installation both from the integration registry and from the ARM64 tarball package on AMD64 Home Assistant hosts.
          EOF
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.10
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-4cc530c
      - name: Verify anonymous multiarch image
        run: |
          docker logout ghcr.io
          manifest="$(docker buildx imagetools inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.10)"
          printf '%s\n' "$manifest"
          grep -q 'linux/amd64' <<<"$manifest"
          grep -q 'linux/arm64' <<<"$manifest"
      - name: Remove temporary publisher
        shell: bash
        run: |
          git checkout publish/v0.14.10-exact
          rm -f .github/workflows/publish-v01410-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.10 publisher"
          git push origin HEAD:publish/v0.14.10-exact
