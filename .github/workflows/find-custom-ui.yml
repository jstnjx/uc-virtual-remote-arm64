name: Find custom integration UI

on:
  push:
    branches:
      - feature/custom-integration-menu

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Locate custom integration UI wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '=== install_custom references ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=dist 'install_custom' web-configurator/src || true
          echo '=== ImportCustomIntegration references ==='
          grep -R -n --exclude-dir=node_modules --exclude-dir=dist 'ImportCustomIntegration' web-configurator/src || true
          echo '=== integration component files ==='
          find web-configurator/src/components/integration -maxdepth 1 -type f -printf '%f\n' | sort
