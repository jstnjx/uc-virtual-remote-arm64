name: Dispatch v0.15.1 release pipelines

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-v0.15.1.yml

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Dispatch existing release pipelines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"event_type":"publish-release","client_payload":{"tag":"v0.15.1","version":"0.15.1","major_minor":"0.15","major":"0","stable":"true"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dispatch-v0.15.1.yml
          git commit -m "Remove v0.15.1 dispatcher"
          git push origin HEAD:main
