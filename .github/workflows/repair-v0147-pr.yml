name: Repair v0.14.7 via PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'repair/v0.14.7-retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python3 tools/repair-v0147.py
      - name: Test repair
        run: |
          npm ci
          npm run ci
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git rm -f tools/repair-v0147.py .github/workflows/repair-v0147.yml .github/workflows/repair-v0147b.yml .github/workflows/repair-v0147-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Home Assistant integration installs and add stale-record repair"
          git push origin HEAD:main
