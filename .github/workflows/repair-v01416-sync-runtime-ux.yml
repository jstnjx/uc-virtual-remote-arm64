name: Repair v0.14.16 Sync runtime UX

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/v0.14.16-sync-runtime-ux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.14.16-sync-runtime-ux
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply v0.14.16 changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"patch anchor not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Version bump.
          Path('VERSION').write_text('0.14.16\n')
          for filename in ('package.json', 'package-lock.json'):
              p = Path(filename)
              data = json.loads(p.read_text())
              data['version'] = '0.14.16'
              if filename == 'package-lock.json' and '' in data.get('packages', {}):
                  data['packages']['']['version'] = '0.14.16'
              p.write_text(json.dumps(data, indent=2) + '\n')

          # Do not erase a query typed while integration discovery is starting.
          replace_once(
              'web-configurator/src/components/elements/entity/AddDevice.vue',
              '''  if (val) {\n    await startDiscover();\n    searchText.value = "";\n    discoverIntervalId.value = setInterval(() => {''',
              '''  if (val) {\n    // Clear the previous modal session before discovery starts. Never clear the\n    // field after awaiting discovery: the user may already be typing while the\n    // discovery request is in flight.\n    searchText.value = "";\n    await startDiscover();\n    discoverIntervalId.value = setInterval(() => {'''
          )

          # Make the distinct synchronization mechanisms explicit in the UI.
          replace_once(
              'web-configurator/src/components/settings/SyncMode.vue',
              '''      <div class="sync-status-grid"><div class="sync-status"><span>Primary</span><strong>{{ form.primary.node_name || "Virtual Remote" }}</strong></div><div class="sync-status"><span>Paired remotes</span><strong>{{ state.agent.satellites.length }}</strong></div><div class="sync-status"><span>Automatic sync</span><strong>{{ form.sync.auto_sync ? `Every ${intervalMinutes} min` : "Off" }}</strong></div></div>\n      <section class="sync-card"><h2>Primary Remote</h2>''',
              '''      <div class="sync-status-grid"><div class="sync-status"><span>Primary</span><strong>{{ form.primary.node_name || "Virtual Remote" }}</strong></div><div class="sync-status"><span>Paired remotes</span><strong>{{ state.agent.satellites.length }}</strong></div><div class="sync-status"><span>Configuration sync</span><strong>{{ form.sync.auto_sync ? "Event-driven" : "Manual only" }}</strong></div></div>\n      <section class="sync-card sync-level-card"><h2>How synchronization works</h2><p>Sync Mode uses different synchronization levels depending on what changed. The reconciliation interval is a safety check, not a delay before normal changes are copied.</p><div class="sync-levels"><div class="sync-level"><strong>1. Live usage</strong><small>Commands and activity state are relayed in real time. They do not wait for or trigger a full configuration snapshot.</small></div><div class="sync-level"><strong>2. Configuration changes</strong><small>Changes to entities, activities, profiles, docks and other synchronized configuration are detected from Core events. Changes are batched for about 20 seconds and event-driven full syncs are limited to at most once per minute.</small></div><div class="sync-level"><strong>3. Periodic reconciliation</strong><small>Every {{ intervalMinutes }} minutes, Sync Mode checks for missed or stale satellite updates and retries them. The default is 60 minutes.</small></div><div class="sync-level"><strong>4. Full audit</strong><small>A full reconciliation audit runs every 24 hours to catch configuration drift that events or retries may have missed.</small></div></div></section>\n      <section class="sync-card"><h2>Primary Remote</h2>'''
          )
          replace_once(
              'web-configurator/src/components/settings/SyncMode.vue',
              '''      <section class="sync-card"><div class="sync-section-heading"><div><h2>Automatic synchronization</h2><p>Keep paired remotes updated without having to press Sync now.</p></div><label class="sync-toggle"><input v-model="form.sync.auto_sync" type="checkbox" /><span>{{ form.sync.auto_sync ? "On" : "Off" }}</span></label></div><label v-if="form.sync.auto_sync" class="sync-field compact-field"><span>Sync every</span><div class="input-with-unit"><input v-model.number="intervalMinutes" type="number" min="5" max="1440" /><span>minutes</span></div></label><label class="sync-option-row">''',
              '''      <section class="sync-card"><div class="sync-section-heading"><div><h2>Automatic configuration synchronization</h2><p>Configuration changes sync from Core events without waiting for the timer below. The timer controls periodic reconciliation for missed or stale updates.</p></div><label class="sync-toggle"><input v-model="form.sync.auto_sync" type="checkbox" /><span>{{ form.sync.auto_sync ? "On" : "Off" }}</span></label></div><label v-if="form.sync.auto_sync" class="sync-field compact-field"><span>Reconcile every</span><div class="input-with-unit"><input v-model.number="intervalMinutes" type="number" min="5" max="1440" /><span>minutes</span></div></label><label class="sync-option-row">'''
          )
          replace_once(
              'web-configurator/src/components/settings/SyncMode.vue',
              '''.sync-status span{font-size:12px;opacity:.62}.sync-field{display:grid;gap:7px;font-size:13px}''',
              '''.sync-status span{font-size:12px;opacity:.62}.sync-levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.sync-level{display:grid;gap:5px;padding:14px 15px;border:1px solid var(--color-border,rgba(255,255,255,.1));border-radius:10px;background:rgba(255,255,255,.025)}.sync-level small{font-size:12px;line-height:1.5;opacity:.68}.sync-field{display:grid;gap:7px;font-size:13px}'''
          )
          replace_once(
              'web-configurator/src/components/settings/SyncMode.vue',
              '''.sync-status-grid,.sync-sections,.sync-grid,.advanced-options{grid-template-columns:1fr}''',
              '''.sync-status-grid,.sync-levels,.sync-sections,.sync-grid,.advanced-options{grid-template-columns:1fr}'''
          )

          # Give the official HA integration an architecture-specific release-binary
          # fallback when Docker is unavailable. This avoids shipping a Rust compiler.
          replace_once(
              'src/external-integrations/service.js',
              '''  "uc-intg-hass": { driver_id: "hass_external", skip_repo_dockerfile: true, patch_driver_metadata: true, websocket_path: "/ws" },''',
              '''  "uc-intg-hass": {\n    driver_id: "hass_external",\n    skip_repo_dockerfile: true,\n    patch_driver_metadata: true,\n    websocket_path: "/ws",\n    process_release: {\n      repository: "unfoldedcircle/integration-home-assistant",\n      binary: "uc-intg-hass",\n      assets: {\n        x64: "uc-intg-hass-{tag}-Linux-x64.tar.gz",\n        arm64: "uc-intg-hass-{tag}-UCR2.tar.gz"\n      }\n    }\n  },'''
          )
          replace_once(
              'src/external-integrations/service.js',
              '''  return base;\n}\n\nfunction normalizedWebSocketPath(value) {''',
              '''  return base;\n}\n\nexport function processReleaseAsset(profile, tag, arch = process.arch) {\n  const release = profile?.process_release;\n  const normalizedTag = String(tag || "").trim();\n  const template = release?.assets?.[arch];\n  if (!release?.repository || !release?.binary || !normalizedTag || !template) return null;\n  const version = normalizedTag.replace(/^v/i, "");\n  return {\n    repository: String(release.repository),\n    binary: String(release.binary),\n    tag: normalizedTag,\n    version,\n    asset: String(template).replaceAll("{tag}", normalizedTag).replaceAll("{version}", version)\n  };\n}\n\nfunction normalizedWebSocketPath(value) {'''
          )

          service = Path('src/external-integrations/service.js')
          text = service.read_text()
          marker = '''\n\n  async #installProcess(entry, job, options = {}, profile = runtimeProfile(entry)) {'''
          if marker not in text:
              raise SystemExit('installProcess marker not found')
          methods = r'''

  async #githubProcessRelease(profile, version = "latest") {
    const repository = String(profile?.process_release?.repository || "").trim();
    if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
      throw new Error("Process release repository is invalid");
    }
    const requested = String(version || "latest").trim() || "latest";
    const tag = requested === "latest" ? null : (requested.startsWith("v") ? requested : `v${requested}`);
    const url = tag
      ? `https://api.github.com/repos/${repository}/releases/tags/${encodeURIComponent(tag)}`
      : `https://api.github.com/repos/${repository}/releases/latest`;
    if (!this.fetchImpl) throw new Error("fetch is unavailable");
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 30_000);
    const headers = {
      "User-Agent": `uc-virtual-remote/${this.platform.version}`,
      Accept: "application/vnd.github+json"
    };
    const token = String(process.env.UCVR_GITHUB_TOKEN || "").trim();
    if (token) headers.Authorization = `Bearer ${token}`;
    let response;
    try { response = await this.fetchImpl(url, { headers, signal: controller.signal }); }
    finally { clearTimeout(timer); }
    if (!response.ok) {
      throw new Error(`Official integration release lookup returned HTTP ${response.status}`);
    }
    const release = await response.json();
    if (!release?.tag_name || !Array.isArray(release.assets)) {
      throw new Error("Official integration release metadata is incomplete");
    }
    return release;
  }

  async #prepareProcessRelease(profile, job, appDir, port) {
    const release = await this.#githubProcessRelease(profile, job.version);
    const selected = processReleaseAsset(profile, release.tag_name, process.arch);
    if (!selected) {
      throw Object.assign(new Error(`No official process release is defined for ${process.arch}`), { status: 503 });
    }
    const asset = release.assets.find((item) => String(item?.name || "") === selected.asset);
    if (!asset?.browser_download_url) {
      throw new Error(`Official release ${release.tag_name} does not contain ${selected.asset}`);
    }

    job.message = `Downloading official ${selected.version} release for ${process.arch}`;
    job.updatedAt = new Date().toISOString();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 2 * 60_000);
    let response;
    try {
      response = await this.fetchImpl(asset.browser_download_url, {
        headers: { "User-Agent": `uc-virtual-remote/${this.platform.version}` },
        signal: controller.signal
      });
    } finally { clearTimeout(timer); }
    if (!response.ok) throw new Error(`Official integration download returned HTTP ${response.status}`);
    const buffer = Buffer.from(await response.arrayBuffer());
    if (!buffer.length || buffer.length > 64 * 1024 * 1024) {
      throw new Error("Official integration release archive is empty or unexpectedly large");
    }

    const runtimeDir = path.join(appDir, ".ucvr-release");
    fs.rmSync(runtimeDir, { recursive: true, force: true });
    fs.mkdirSync(runtimeDir, { recursive: true });
    const archive = path.join(runtimeDir, "integration.tar.gz");
    fs.writeFileSync(archive, buffer, { mode: 0o600 });
    const listing = await this.#jobCommand(job, "tar", ["-tzf", archive], { timeoutMs: 30_000 });
    for (const item of String(listing.stdout || "").split(/\r?\n/).map((value) => value.trim()).filter(Boolean)) {
      if (item.startsWith("/") || item.split("/").includes("..")) {
        fs.rmSync(runtimeDir, { recursive: true, force: true });
        throw new Error(`Unsafe path in official integration release: ${item}`);
      }
    }
    await this.#jobCommand(job, "tar", ["-xzf", archive, "-C", runtimeDir, "--no-same-owner"], { timeoutMs: 60_000 });
    fs.rmSync(archive, { force: true });

    const binary = path.join(runtimeDir, selected.binary);
    if (!fs.existsSync(binary) || !fs.statSync(binary).isFile()) {
      throw new Error(`Official integration release does not contain executable ${selected.binary}`);
    }
    fs.chmodSync(binary, 0o755);

    // integration-home-assistant cannot override nested integration.http.port
    // with UC_* environment variables. Give every supervised instance its own
    // explicit listener configuration instead of colliding on the default 8000.
    const configFile = path.join(runtimeDir, "ucvr-configuration.yaml");
    fs.writeFileSync(configFile, [
      "integration:",
      `  interface: ${JSON.stringify(this.integrationHost)}`,
      "  http:",
      "    enabled: true",
      `    port: ${port}`,
      "  https:",
      "    enabled: false",
      "    port: 9443",
      ""
    ].join("\n"));

    return {
      command: binary,
      args: ["--config", configFile],
      cwd: runtimeDir,
      version: selected.version,
      releaseTag: selected.tag,
      releaseAsset: selected.asset
    };
  }
'''
          service.write_text(text.replace(marker, methods + marker, 1))

          replace_once(
              'src/external-integrations/service.js',
              '''    const stack = detectStack(appDir, profile);\n    if (!["python", "node"].includes(stack)) {\n      throw Object.assign(new Error(`Docker is unavailable and the ${stack} source stack does not yet have a direct process runtime. Use a custom integration package or a host with Docker.`), { status: 503 });\n    }\n\n    const config = writableDirectory(path.join(this.configDir, processName));''',
              '''    const stack = detectStack(appDir, profile);\n    const hasReleaseRuntime = Boolean(profile.process_release);\n    if (!["python", "node"].includes(stack) && !hasReleaseRuntime) {\n      throw Object.assign(new Error(`Docker is unavailable and the ${stack} source stack does not yet have a direct process runtime. Use a custom integration package or a host with Docker.`), { status: 503 });\n    }\n\n    const config = writableDirectory(path.join(this.configDir, processName));'''
          )
          replace_once(
              'src/external-integrations/service.js',
              '''    let command;\n    let args;\n\n    job.phase = "building";\n    job.progress = 30;\n    if (stack === "python") {''',
              '''    let command;\n    let args;\n    let runtimeCwd = appDir;\n    let runtimeSource = "build";\n    let runtimeVersion = job.version;\n    let releaseTag = null;\n    let releaseAsset = null;\n\n    job.phase = "building";\n    job.progress = 30;\n    if (hasReleaseRuntime) {\n      const releaseRuntime = await this.#prepareProcessRelease(profile, job, appDir, port);\n      if (identity.uid) {\n        await this.#jobCommand(job, "chown", ["-R", `${identity.uid}:${identity.gid}`, appDir, config, data], { timeoutMs: 120_000 });\n      }\n      command = releaseRuntime.command;\n      args = releaseRuntime.args;\n      runtimeCwd = releaseRuntime.cwd;\n      runtimeSource = "release";\n      runtimeVersion = releaseRuntime.version;\n      releaseTag = releaseRuntime.releaseTag;\n      releaseAsset = releaseRuntime.releaseAsset;\n      job.message = `Official integration ${runtimeVersion} ready`;\n    } else if (stack === "python") {'''
          )
          replace_once(
              'src/external-integrations/service.js',
              '''    const revision = await this.#localRepositoryRevision(appDir).catch(() => null);\n    const record = {\n      registry_id: entry.id, driver_id: driverId, name: entry.name || driverId, repository: entry.repository,\n      container: processName, runtime: "process", image: null, source: "build", port, version: job.version,\n      websocket_path: integrationWebSocketPath(entry) || null,\n      runtime_command: command, runtime_args: args, runtime_cwd: appDir, runtime_env: environment,''',
              '''    const revision = runtimeSource === "build" ? await this.#localRepositoryRevision(appDir).catch(() => null) : null;\n    const record = {\n      registry_id: entry.id, driver_id: driverId, name: entry.name || driverId, repository: entry.repository,\n      container: processName, runtime: "process", image: null, source: runtimeSource, port, version: runtimeVersion,\n      websocket_path: integrationWebSocketPath(entry) || null,\n      runtime_command: command, runtime_args: args, runtime_cwd: runtimeCwd, runtime_env: environment,'''
          )
          replace_once(
              'src/external-integrations/service.js',
              '''      ...(revision ? { revision } : {}),\n      installed_at: options.installedAt''',
              '''      ...(revision ? { revision } : {}),\n      ...(releaseTag ? { release_tag: releaseTag } : {}),\n      ...(releaseAsset ? { release_asset: releaseAsset } : {}),\n      installed_at: options.installedAt'''
          )
          replace_once(
              'src/external-integrations/service.js',
              '''    const profile = runtimeProfile(entry);\n    if (!this.dockerAvailable) {''',
              '''    const profile = runtimeProfile(entry);\n    if (job.source === "release" && profile.process_release) {\n      return await this.#installProcess(entry, job, options, profile);\n    }\n    if (!this.dockerAvailable) {'''
          )
          replace_once(
              'src/external-integrations/service.js',
              '''    try {\n      if (record.source === "build" && ownerRepo(entry.repository)) {''',
              '''    try {\n      if (record.source === "release" && runtimeProfile(entry).process_release) {\n        const profile = runtimeProfile(entry);\n        const release = await this.#githubProcessRelease(profile, record.version === "latest" ? "latest" : (record.release_tag || record.version));\n        const installed = String(record.release_tag || (record.version ? `v${String(record.version).replace(/^v/i, "")}` : ""));\n        const available = String(release.tag_name || "");\n        return {\n          ...base,\n          installed_ref: installed || null,\n          available_ref: available || null,\n          available_version: available ? available.replace(/^v/i, "") : null,\n          update_available: Boolean(installed && available && installed !== available),\n          update_supported: true\n        };\n      }\n      if (record.source === "build" && ownerRepo(entry.repository)) {'''
          )

          # Regression tests for all three user-visible failures.
          Path('test/v01416-sync-runtime-ux.test.js').write_text(r'''import assert from "node:assert/strict";
import fs from "node:fs";
import test from "node:test";

import { processReleaseAsset } from "../src/external-integrations/service.js";

const addDevice = fs.readFileSync(new URL("../web-configurator/src/components/elements/entity/AddDevice.vue", import.meta.url), "utf8");
const syncMode = fs.readFileSync(new URL("../web-configurator/src/components/settings/SyncMode.vue", import.meta.url), "utf8");
const externalService = fs.readFileSync(new URL("../src/external-integrations/service.js", import.meta.url), "utf8");

test("integration discovery cannot erase search text typed while discovery starts", () => {
  const branch = addDevice.match(/if \(val\) \{([\s\S]*?)\n  \} else \{/s)?.[1] || "";
  const reset = branch.indexOf('searchText.value = ""');
  const discover = branch.indexOf("await startDiscover()");
  assert.ok(reset >= 0 && discover >= 0 && reset < discover);
  assert.equal(branch.indexOf('searchText.value = ""', reset + 1), -1);
});

test("Sync Mode explains live, event-driven, reconciliation and audit synchronization", () => {
  assert.match(syncMode, /How synchronization works/);
  assert.match(syncMode, /1\. Live usage/);
  assert.match(syncMode, /2\. Configuration changes/);
  assert.match(syncMode, /3\. Periodic reconciliation/);
  assert.match(syncMode, /4\. Full audit/);
  assert.match(syncMode, /Reconcile every/);
  assert.match(syncMode, /Configuration sync/);
  assert.doesNotMatch(syncMode, /<span>Sync every<\/span>/);
});

test("official Home Assistant has architecture-specific supervised release assets", () => {
  const profile = {
    process_release: {
      repository: "unfoldedcircle/integration-home-assistant",
      binary: "uc-intg-hass",
      assets: {
        x64: "uc-intg-hass-{tag}-Linux-x64.tar.gz",
        arm64: "uc-intg-hass-{tag}-UCR2.tar.gz"
      }
    }
  };
  assert.deepEqual(processReleaseAsset(profile, "v0.16.4", "x64"), {
    repository: "unfoldedcircle/integration-home-assistant",
    binary: "uc-intg-hass",
    tag: "v0.16.4",
    version: "0.16.4",
    asset: "uc-intg-hass-v0.16.4-Linux-x64.tar.gz"
  });
  assert.equal(processReleaseAsset(profile, "v0.16.4", "arm64")?.asset, "uc-intg-hass-v0.16.4-UCR2.tar.gz");
  assert.match(externalService, /source: runtimeSource/);
  assert.match(externalService, /release_tag: releaseTag/);
  assert.match(externalService, /ucvr-configuration\.yaml/);
  assert.match(externalService, /--config/);
});
''')
          PY
      - name: Validate source and tests
        run: |
          npm ci
          npm run ci
      - name: Commit clean product change
        run: |
          rm -f .github/workflows/repair-v01416-sync-runtime-ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Improve Sync Mode UX and HAOS integration runtime"
          git push origin HEAD:fix/v0.14.16-sync-runtime-ux
