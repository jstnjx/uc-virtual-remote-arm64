name: Publish exact v0.14.17

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.17-exact'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4ab635032ccf6d7ad9ea37d890afbd948097446c
          fetch-depth: 0
      - name: Validate exact source
        run: |
          test "$(cat VERSION)" = "0.14.17"
          test "$(node -p "require('./package.json').version")" = "0.14.17"
          test "$(git rev-parse HEAD)" = "4ab635032ccf6d7ad9ea37d890afbd948097446c"
      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.14.17 >/dev/null 2>&1; then
            gh release create v0.14.17 \
              --target 4ab635032ccf6d7ad9ea37d890afbd948097446c \
              --title "UC Virtual Remote v0.14.17" \
              --notes "Fixes settings that could appear saved but later revert after another edit or restart. Single-setting Web Configurator changes are now true partial PATCHes, persisted Voice Control is exposed through the configurator compatibility key, explicitly saved Bluetooth/Wi-Fi/HCI states are restored after restart, and the Haptic Feedback toggle now writes its own value. Adds restart-persistence regression coverage for display brightness, button-backlight brightness/color, Bluetooth/HCI state and Voice Control."
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.17
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-4ab6350
      - name: Verify anonymous multiarch image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.17 | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
      - name: Remove temporary publisher
        run: |
          git checkout publish/v0.14.17-exact
          rm -f .github/workflows/publish-v01417-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.17 publisher"
          git push origin HEAD:publish/v0.14.17-exact
