name: Validate v0.14.10 images

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'fix/v0.14.10-python-packaging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.14.10-python-packaging
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 appliance
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ucvr:test-amd64
      - name: Build arm64 appliance
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: ucvr:test-arm64
      - name: Remove temporary validator
        shell: bash
        run: |
          rm -f .github/workflows/validate-v01410-images.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.10 architecture validator"
          git push origin HEAD:fix/v0.14.10-python-packaging
