name: Retry v0.14.9 registry and simulator repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/v0.14.9-registry-simulator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply corrected source changes
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/v0149-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if marker not in workflow:
              raise SystemExit('original patch script marker missing')
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(script)
          script = script.replace("process_methods = r'''", "process_methods = '''", 1)
          exec(compile(script, '<v0149-repair>', 'exec'))
          BOOT

      - name: Validate repair
        run: npm run ci

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0149-repair.yml .github/workflows/v0149-repair-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix HAOS registry runtime and Remote Simulator parity"
          git push origin HEAD:${{ github.head_ref }}
