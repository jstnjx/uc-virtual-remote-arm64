name: Apply v0.14.10 Python packaging repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/v0.14.10-python-packaging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.14.10-python-packaging
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          external = "src/external-integrations/service.js"
          replace_once(
              external,
              '''function pythonEntrypoint(root, profile) {
            if (profile.python_entrypoint && fs.existsSync(path.join(root, profile.python_entrypoint))) return profile.python_entrypoint;
            const direct = findFile(root, ["driver.py", "src/driver.py", "main.py", "src/main.py"]);
            if (direct) return direct;
            return walk(root).find((item) => /(^|\\/)driver\\.py$/i.test(item)) || walk(root).find((item) => /(^|\\/)main\\.py$/i.test(item)) || null;
          }
          ''',
              '''function pythonEntrypoint(root, profile) {
            if (profile.python_entrypoint && fs.existsSync(path.join(root, profile.python_entrypoint))) return profile.python_entrypoint;
            const direct = findFile(root, ["driver.py", "src/driver.py", "main.py", "src/main.py"]);
            if (direct) return direct;
            return walk(root).find((item) => /(^|\\/)driver\\.py$/i.test(item)) || walk(root).find((item) => /(^|\\/)main\\.py$/i.test(item)) || null;
          }

          export function pythonLaunchTarget(root, profile = {}) {
            if (profile.python_entrypoint) {
              const explicit = path.join(root, profile.python_entrypoint);
              if (fs.existsSync(explicit) && fs.statSync(explicit).isFile()) {
                return { kind: "script", value: profile.python_entrypoint };
              }
            }
            if (profile.python_module) {
              const moduleName = String(profile.python_module).trim();
              if (moduleName) return { kind: "module", value: moduleName };
            }

            // Python integrations commonly expose their real runtime as
            // `python -m package` while also containing an internal driver.py.
            // Prefer a single top-level import package with __main__.py over
            // executing that implementation file directly.
            const modules = fs.readdirSync(root, { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && !entry.name.startsWith("."))
              .filter((entry) => fs.existsSync(path.join(root, entry.name, "__init__.py")) && fs.existsSync(path.join(root, entry.name, "__main__.py")))
              .map((entry) => entry.name);
            if (modules.length === 1) return { kind: "module", value: modules[0] };

            const entrypoint = pythonEntrypoint(root, profile);
            return entrypoint ? { kind: "script", value: entrypoint } : null;
          }
          ''')

          replace_once(
              external,
              '''    if (stack === "python") {
                const entrypoint = pythonEntrypoint(appDir, profile);
                if (!entrypoint) throw new Error("Python integration entrypoint could not be detected");
                const venv = path.join(this.venvDir, slug(entry.id));
          ''',
              '''    if (stack === "python") {
                const launchTarget = pythonLaunchTarget(appDir, profile);
                if (!launchTarget) throw new Error("Python integration entrypoint could not be detected");
                const venv = path.join(this.venvDir, slug(entry.id));
          ''')

          replace_once(
              external,
              '''      command = python;
                args = [path.resolve(appDir, entrypoint)];
              } else {
          ''',
              '''      command = python;
                args = launchTarget.kind === "module"
                  ? ["-m", launchTarget.value]
                  : [path.resolve(appDir, launchTarget.value)];
              } else {
          ''')

          replace_once(
              external,
              '''      PYTHONUNBUFFERED: "1",
                PYTHONDONTWRITEBYTECODE: "1",
                ...(profile.environment || {})
          ''',
              '''      PYTHONUNBUFFERED: "1",
                PYTHONDONTWRITEBYTECODE: "1",
                PYTHONPATH: [appDir, process.env.PYTHONPATH].filter(Boolean).join(":"),
                ...(profile.environment || {})
          ''')

          native = "src/native-integrations/service.js"
          replace_once(
              native,
              '''export function packageExecutable(root) {
            const standard = path.join(root, "bin", "driver");
            if (fs.existsSync(standard) && fs.statSync(standard).isFile()) return standard;
            const nodeStandard = path.join(root, "bin", "driver.js");
            if (fs.existsSync(nodeStandard) && fs.statSync(nodeStandard).isFile()) return nodeStandard;
            const bin = path.join(root, "bin");
            if (fs.existsSync(bin)) {
              const candidates = fs.readdirSync(bin)
                .map((name) => path.join(bin, name))
                .filter((filename) => {
                  try { return fs.statSync(filename).isFile() && (fs.statSync(filename).mode & 0o111); }
                  catch { return false; }
                });
              if (candidates.length === 1) return candidates[0];
            }
            throw Object.assign(new Error("Integration archive is missing bin/driver or bin/driver.js"), { status: 422 });
          }
          ''',
              '''export function packageExecutable(root) {
            const standard = path.join(root, "bin", "driver");
            if (fs.existsSync(standard) && fs.statSync(standard).isFile()) return standard;
            const nodeStandard = path.join(root, "bin", "driver.js");
            if (fs.existsSync(nodeStandard) && fs.statSync(nodeStandard).isFile()) return nodeStandard;
            const bin = path.join(root, "bin");
            if (fs.existsSync(bin)) {
              const candidates = fs.readdirSync(bin)
                .map((name) => path.join(bin, name))
                .filter((filename) => {
                  try { return fs.statSync(filename).isFile() && (fs.statSync(filename).mode & 0o111); }
                  catch { return false; }
                });
              if (candidates.length === 1) return candidates[0];
            }
            throw Object.assign(new Error("Integration archive is missing bin/driver or bin/driver.js"), { status: 422 });
          }

          export function ensureRuntimeDriverManifest(root, executable) {
            const source = path.join(root, "driver.json");
            const destination = path.join(path.dirname(executable), "driver.json");
            if (!fs.existsSync(source) || path.resolve(source) === path.resolve(destination) || fs.existsSync(destination)) return null;
            fs.copyFileSync(source, destination);
            try { fs.chmodSync(destination, fs.statSync(source).mode & 0o777); } catch {}
            return destination;
          }
          ''')

          replace_once(
              native,
              '''      const executable = packageExecutable(sourceRoot);
                fs.chmodSync(executable, fs.statSync(executable).mode | 0o755);
                const architecture = executableArchitecture(executable);
          ''',
              '''      const executable = packageExecutable(sourceRoot);
                fs.chmodSync(executable, fs.statSync(executable).mode | 0o755);
                ensureRuntimeDriverManifest(sourceRoot, executable);
                const architecture = executableArchitecture(executable);
          ''')

          test_path = Path("test/integration-install-regression.test.js")
          text = test_path.read_text()
          text = text.replace(
              'import { dockerfileBuildPath } from "../src/external-integrations/service.js";\n',
              'import { dockerfileBuildPath, pythonLaunchTarget } from "../src/external-integrations/service.js";\nimport { ensureRuntimeDriverManifest } from "../src/native-integrations/service.js";\n',
              1,
          )
          text += r'''

          test("Python registry runtime prefers a package __main__ over an internal driver.py", () => {
            const root = fs.mkdtempSync(path.join(process.cwd(), ".test-python-launch-"));
            try {
              fs.mkdirSync(path.join(root, "uc_intg_spotify"));
              fs.writeFileSync(path.join(root, "uc_intg_spotify", "__init__.py"), "");
              fs.writeFileSync(path.join(root, "uc_intg_spotify", "__main__.py"), "");
              fs.writeFileSync(path.join(root, "uc_intg_spotify", "driver.py"), "");
              assert.deepEqual(pythonLaunchTarget(root), { kind: "module", value: "uc_intg_spotify" });
              assert.deepEqual(
                pythonLaunchTarget(root, { python_entrypoint: "uc_intg_spotify/driver.py" }),
                { kind: "script", value: "uc_intg_spotify/driver.py" }
              );
            } finally {
              fs.rmSync(root, { recursive: true, force: true });
            }
          });

          test("native package runtime mirrors root driver.json beside bin/driver without overwriting package data", () => {
            const root = fs.mkdtempSync(path.join(process.cwd(), ".test-driver-manifest-"));
            try {
              fs.mkdirSync(path.join(root, "bin"));
              fs.writeFileSync(path.join(root, "driver.json"), '{"driver_id":"spotify"}');
              fs.writeFileSync(path.join(root, "bin", "driver"), "binary");
              const copied = ensureRuntimeDriverManifest(root, path.join(root, "bin", "driver"));
              assert.equal(copied, path.join(root, "bin", "driver.json"));
              assert.equal(fs.readFileSync(copied, "utf8"), '{"driver_id":"spotify"}');
              fs.writeFileSync(copied, "keep-me");
              assert.equal(ensureRuntimeDriverManifest(root, path.join(root, "bin", "driver")), null);
              assert.equal(fs.readFileSync(copied, "utf8"), "keep-me");
            } finally {
              fs.rmSync(root, { recursive: true, force: true });
            }
          });
          '''
          test_path.write_text(text)

          for filename in ["VERSION", "package.json", "package-lock.json"]:
              p = Path(filename)
              text = p.read_text()
              if "0.14.9" not in text:
                  raise SystemExit(f"0.14.9 not found in {filename}")
              p.write_text(text.replace("0.14.9", "0.14.10"))
          PY
      - name: Validate repair
        run: |
          npm ci
          npm run ci
      - name: Commit validated repair
        shell: bash
        run: |
          rm -f .github/workflows/apply-v01410-python-packaging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Python registry and PyInstaller package launching"
          git push origin HEAD:fix/v0.14.10-python-packaging
