name: Validate v0.14.9 images

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'fix/v0.14.9-registry-simulator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 appliance
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ucvr:v0149-amd64
          cache-from: type=gha,scope=v0149-validation
      - name: Build arm64 appliance
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: ucvr:v0149-arm64
          cache-from: type=gha,scope=v0149-validation
      - name: Remove temporary validator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v0149-image-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.9 image validator"
          git push origin HEAD:${{ github.head_ref }}
