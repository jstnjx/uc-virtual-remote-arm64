name: Apply v0.14.11 final TLS fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/v0.14.11-arm64-https'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.14.11-arm64-https
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply scoped ARM64 OpenSSL fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/native-integrations/service.js')
          source = path.read_text()
          old = '    LD_LIBRARY_PATH: [internalDir, inheritedLd].filter(Boolean).join(":")\n'
          new = '    LD_LIBRARY_PATH: [internalDir, inheritedLd].filter(Boolean).join(":"),\n    OPENSSL_armcap: String(process.env.UCVR_ARM64_OPENSSL_ARMCAP || "0")\n'
          if old not in source:
              raise SystemExit('PyInstaller environment anchor not found')
          path.write_text(source.replace(old, new, 1))

          test_path = Path('test/integration-install-regression.test.js')
          tests = test_path.read_text()
          old_import = 'import { ensureRuntimeDriverManifest } from "../src/native-integrations/service.js";'
          new_import = 'import { ensureRuntimeDriverManifest, pyInstallerOnedirEnvironment } from "../src/native-integrations/service.js";'
          if old_import not in tests:
              raise SystemExit('native service test import anchor not found')
          tests = tests.replace(old_import, new_import, 1)
          tests += '''\n\ntest("emulated ARM64 PyInstaller integrations disable OpenSSL ARM acceleration by default", () => {\n  const env = pyInstallerOnedirEnvironment(\n    { executable: "/tmp/pkg/bin/driver", architecture: "arm64" },\n    { runtimeArch: "x64", isDirectory: () => true, ldLibraryPath: "" }\n  );\n  assert.equal(env.OPENSSL_armcap, "0");\n  assert.equal(env._PYI_PARENT_PROCESS_LEVEL, "0");\n});\n'''
          test_path.write_text(tests)
      - name: Revert unnecessary QEMU upgrade experiment
        shell: bash
        run: git show v0.14.10:Dockerfile > Dockerfile
      - name: Remove temporary diagnostic workflows
        shell: bash
        run: |
          rm -f .github/workflows/validate-v01411-arm64-https.yml
          rm -f .github/workflows/apply-v01411-final.yml
      - name: Validate final source
        run: |
          npm ci
          npm run ci
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m "Fix TLS in emulated ARM64 integrations"
          git push origin HEAD:fix/v0.14.11-arm64-https
