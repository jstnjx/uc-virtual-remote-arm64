name: Repair v0.14.7 integration runtime retry

on:
  push:
    branches:
      - repair/v0.14.7-retry

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          native = "src/native-integrations/service.js"
          rep(native, '''function packageExecutable(root) {
            const standard = path.join(root, "bin", "driver");
            if (fs.existsSync(standard) && fs.statSync(standard).isFile()) return standard;
            const bin = path.join(root, "bin");
            if (fs.existsSync(bin)) {
              const candidates = fs.readdirSync(bin)
                .map((name) => path.join(bin, name))
                .filter((filename) => {
                  try { return fs.statSync(filename).isFile() && (fs.statSync(filename).mode & 0o111); }
                  catch { return false; }
                });
              if (candidates.length === 1) return candidates[0];
            }
            throw Object.assign(new Error("Integration archive is missing the standard bin/driver executable"), { status: 422 });
          }
          ''', '''export function packageExecutable(root) {
            const standard = path.join(root, "bin", "driver");
            if (fs.existsSync(standard) && fs.statSync(standard).isFile()) return standard;
            const nodeStandard = path.join(root, "bin", "driver.js");
            if (fs.existsSync(nodeStandard) && fs.statSync(nodeStandard).isFile()) return nodeStandard;
            const bin = path.join(root, "bin");
            if (fs.existsSync(bin)) {
              const candidates = fs.readdirSync(bin)
                .map((name) => path.join(bin, name))
                .filter((filename) => {
                  try { return fs.statSync(filename).isFile() && (fs.statSync(filename).mode & 0o111); }
                  catch { return false; }
                });
              if (candidates.length === 1) return candidates[0];
            }
            throw Object.assign(new Error("Integration archive is missing bin/driver or bin/driver.js"), { status: 422 });
          }
          ''')

          rep(native, '''  // PyInstaller 6.x onedir applications normally restart their bootloader once
            // after modifying LD_LIBRARY_PATH. Under process-scoped QEMU that guest
            // execve would escape the emulator. Seed the post-restart environment so the
            // bootloader proceeds directly as its main process instead.
            const inheritedLd = String(options.ldLibraryPath ?? process.env.LD_LIBRARY_PATH ?? "").trim();
            return {
              _PYI_ARCHIVE_FILE: executable,
              _PYI_PARENT_PROCESS_LEVEL: "-1",
              LD_LIBRARY_PATH: [internalDir, inheritedLd].filter(Boolean).join(":")
            };
          ''', '''  // POSIX PyInstaller onedir applications normally restart their bootloader once
            // after modifying LD_LIBRARY_PATH. Under process-scoped QEMU that guest
            // execve would escape the emulator. Seed the post-restart environment.
            // Older bootloaders only accept 0/1; 0 is the post-restart main process.
            const inheritedLd = String(options.ldLibraryPath ?? process.env.LD_LIBRARY_PATH ?? "").trim();
            return {
              _PYI_ARCHIVE_FILE: executable,
              _PYI_PARENT_PROCESS_LEVEL: "0",
              LD_LIBRARY_PATH: [internalDir, inheritedLd].filter(Boolean).join(":")
            };
          ''')

          rep(native, '''export function driverLaunchCommand(record, options = {}) {
            const executable = String(record?.executable || "");
            const architecture = record?.architecture
              || (executable ? executableArchitecture(executable) : null);
            const runtimeArch = String(options.runtimeArch || process.arch);
            if (architecture !== "arm64" || runtimeArch === "arm64") {
              return { command: executable, args: [], emulated: false, architecture: architecture || "script" };
            }
          ''', '''export function driverLaunchCommand(record, options = {}) {
            const executable = String(record?.executable || "");
            const architecture = record?.architecture
              || (executable ? executableArchitecture(executable) : null);
            const runtimeArch = String(options.runtimeArch || process.arch);
            if (path.extname(executable).toLowerCase() === ".js") {
              return { command: process.execPath, args: [executable], emulated: false, architecture: "script" };
            }
            if (architecture !== "arm64" || runtimeArch === "arm64") {
              return { command: executable, args: [], emulated: false, architecture: architecture || "script" };
            }
          ''')

          rep(native, '''      if (metadata.min_core_api && !versionAtLeast(this.platform.restCoreApiVersion, metadata.min_core_api)) {
                throw Object.assign(new Error(`Integration requires Core API ${metadata.min_core_api}, this runtime provides ${this.platform.restCoreApiVersion}`), { status: 409 });
              }
          ''', '''      if (metadata.min_core_api && !versionAtLeast(this.platform.restCoreApiVersion, metadata.min_core_api)) {
                log.warn(`Integration ${driverId} declares Core API ${metadata.min_core_api}; runtime reports ${this.platform.restCoreApiVersion}. min_core_api is informational and is not enforced.`);
              }
          ''')

          rep(native, '''        throw new Error(`Native integration ${record.driver_id} did not open Integration API port ${record.port}.${tail ? ` Last output: ${tail.slice(-2000)}` : ""}`);
          ''', '''        throw Object.assign(
                  new Error(`Native integration ${record.driver_id} did not open Integration API port ${record.port}.${tail ? ` Last output: ${tail.slice(-2000)}` : ""}`),
                  { status: 422, code: "INTEGRATION_START_FAILED" }
                );
          ''')

          ep = "docker-entrypoint.sh"
          marker = '''require_dind_namespace_access() {
            if command -v unshare >/dev/null 2>&1 && unshare --mount /bin/true >/dev/null 2>&1; then
              return 0
            fi

            echo "UC Virtual Remote: internal Docker cannot create mount namespaces in this container." >&2
            echo "UC Virtual Remote: registry/external integrations require CAP_SYS_ADMIN and an unconfined seccomp/AppArmor policy in the top-level container." >&2
            echo "UC Virtual Remote: Home Assistant add-on packages must declare privileged: [SYS_ADMIN]; full_access does not grant Linux capabilities." >&2
            echo "UC Virtual Remote: disabling Home Assistant Protection mode only enables full_access device permissions and does not replace SYS_ADMIN." >&2
            echo "UC Virtual Remote: standalone Docker users should start the appliance with --privileged." >&2
            exit 1
          }
          '''
          rep(ep, marker, marker + '''
          prepare_dind_cgroups() {
            export container=docker
            if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
              probe="/sys/fs/cgroup/.ucvr-cgroup-probe-$$"
              if ! mkdir "$probe" >/dev/null 2>&1; then
                mount -o remount,rw /sys/fs/cgroup >/dev/null 2>&1 || true
              fi
              if ! mkdir "$probe" >/dev/null 2>&1; then
                mount -t cgroup2 -o rw,nosuid,nodev,noexec cgroup2 /sys/fs/cgroup >/dev/null 2>&1 || true
              fi
              if ! mkdir "$probe" >/dev/null 2>&1; then
                echo "UC Virtual Remote: internal Docker cannot create child cgroups under /sys/fs/cgroup." >&2
                echo "UC Virtual Remote: the cgroup v2 hierarchy is read-only or not delegated to this container." >&2
                exit 1
              fi
              rmdir "$probe" >/dev/null 2>&1 || true
              mkdir -p /sys/fs/cgroup/init
              attempts=0
              enabled=0
              while [ "$attempts" -lt 5 ]; do
                xargs -rn1 < /sys/fs/cgroup/cgroup.procs > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
                if sed -e 's/ / +/g' -e 's/^/+/' < /sys/fs/cgroup/cgroup.controllers > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null; then
                  enabled=1
                  break
                fi
                attempts=$((attempts + 1))
              done
              if [ "$enabled" != "1" ]; then
                echo "UC Virtual Remote: unable to delegate cgroup v2 controllers to internal Docker." >&2
                exit 1
              fi
            fi
            mount --make-rshared / >/dev/null 2>&1 || true
          }
          ''')
          rep(ep, '''  require_dind_namespace_access
            mkdir -p "$DIND_DATA_ROOT" /var/run/docker
          ''', '''  require_dind_namespace_access
            prepare_dind_cgroups
            mkdir -p "$DIND_DATA_ROOT" /var/run/docker
          ''')

          mgmt = "src/api/installed-integration-management.js"
          anchor = 'export async function installedIntegrationItems(platform) {\n'
          scanner = r'''function reconciliationDriverId(record) {
            return String(record?.driver_id || record?.metadata?.driver_id || record?.id || "");
          }

          function reconciliationInternal(record) {
            return Boolean(record?.metadata?.internal || String(record?.driver_type || "").toUpperCase() === "INTERNAL");
          }

          function reconciliationReferences(platform, id) {
            return (platform.db.listConfiguredEntities(id)?.length || 0)
              + platform.db.listActivities().filter((item) => String(item.integration_id || "") === String(id)).length
              + platform.db.listMacros().filter((item) => String(item.integration_id || "") === String(id)).length;
          }

          export function integrationReconciliationReport(platform) {
            const records = platform.db.listIntegrations();
            const nativeRecords = Object.values(platform.nativeIntegrations?.state?.integrations || {});
            const externalRecords = Object.values(platform.externalIntegrations?.state?.integrations || {});
            const nativeIds = new Set(nativeRecords.map((item) => String(item.driver_id || "")).filter(Boolean));
            const externalIds = new Set(externalRecords.map((item) => String(item.driver_id || "")).filter(Boolean));
            const canonical = records.filter((item) => !reconciliationInternal(item) && !item.metadata?.instance_alias);
            const canonicalIds = new Set(canonical.map(reconciliationDriverId).filter(Boolean));
            const issues = [];

            for (const record of records) {
              if (record?.metadata?.instance_alias) {
                const target = String(record.metadata.connection_record_id || "");
                if (!target || !platform.db.getIntegration(target)) issues.push({ type: "orphan_instance_alias", record_id: record.id, driver_id: reconciliationDriverId(record), repairable: true, message: `Instance alias ${record.id} points to missing integration ${target || "(none)"}` });
                continue;
              }
              if (reconciliationInternal(record)) continue;
              const id = reconciliationDriverId(record);
              const references = reconciliationReferences(platform, record.id);
              if (record.metadata?.native_runtime && !nativeIds.has(id)) issues.push({ type: "stale_native_database_record", record_id: record.id, driver_id: id, references, repairable: references === 0, message: `Database contains native driver ${id}, but its native runtime state is missing` });
              if ((record.metadata?.registry_managed || record.registry_managed) && !externalIds.has(id)) issues.push({ type: "stale_external_database_record", record_id: record.id, driver_id: id, references, repairable: references === 0, message: `Database contains managed driver ${id}, but its container runtime state is missing` });
            }

            const groups = new Map();
            for (const record of canonical) {
              const id = reconciliationDriverId(record);
              if (!id) continue;
              const values = groups.get(id) || [];
              values.push(record);
              groups.set(id, values);
            }
            for (const [id, values] of groups) if (values.length > 1) issues.push({ type: "duplicate_driver_id", driver_id: id, record_ids: values.map((item) => item.id), repairable: false, message: `Driver ID ${id} is used by ${values.length} database records: ${values.map((item) => item.id).join(", ")}` });
            for (const record of nativeRecords) if (record.driver_id && !canonicalIds.has(String(record.driver_id))) issues.push({ type: "orphan_native_runtime", driver_id: String(record.driver_id), repairable: false, message: `Native runtime state exists for ${record.driver_id}, but no database record exists` });
            for (const record of externalRecords) if (record.driver_id && !canonicalIds.has(String(record.driver_id))) issues.push({ type: "orphan_external_runtime", driver_id: String(record.driver_id), container: record.container || null, repairable: false, message: `Managed container state exists for ${record.driver_id}, but no database record exists` });
            return { healthy: issues.length === 0, database_records: canonical.length, native_runtime_records: nativeRecords.length, external_runtime_records: externalRecords.length, repairable: issues.filter((item) => item.repairable).length, issues };
          }

          export async function repairIntegrationReconciliation(platform) {
            const before = integrationReconciliationReport(platform);
            const repaired = [];
            for (const issue of before.issues.filter((item) => item.repairable)) {
              if (issue.type === "orphan_instance_alias") {
                if (platform.db.deleteIntegration(issue.record_id)) repaired.push(issue);
              } else if (["stale_native_database_record", "stale_external_database_record"].includes(issue.type)) {
                if (await platform.integrations.remove(issue.record_id).catch(() => false)) repaired.push(issue);
              }
            }
            return { repaired, before, after: integrationReconciliationReport(platform) };
          }

          '''
          rep(mgmt, anchor, scanner + anchor)
          rep(mgmt, '''  const matched = route(pathname);
            if (!matched) return json(response, 404, { error: "Not found" });

            if (request.method === "OPTIONS") {
          ''', '''  const matched = route(pathname);
            if (!matched) return json(response, 404, { error: "Not found" });

            if (pathname === `${ROUTE_ROOT}/reconcile` && request.method === "GET") return json(response, 200, integrationReconciliationReport(platform));
            if (pathname === `${ROUTE_ROOT}/reconcile` && request.method === "POST") return json(response, 200, await repairIntegrationReconciliation(platform));

            if (request.method === "OPTIONS") {
          ''')

          ui = "public/integrations-management.js"
          rep(ui, 'const integrationRefresh = document.querySelector("#installed-integrations-refresh");\n', 'const integrationRefresh = document.querySelector("#installed-integrations-refresh");\nconst integrationReconcile = document.querySelector("#installed-integrations-reconcile");\n')
          rep(ui, 'integrationRefresh?.addEventListener("click", refreshInstalledIntegrations);\n', '''async function reconcileInstalledIntegrations() {
            if (!integrationReconcile) return;
            integrationReconcile.disabled = true;
            setResult("working", "Scanning integration records…");
            try {
              const report = await management("/reconcile");
              if (report.healthy) return setResult("success", "No stale, orphaned, or duplicate integration records were found.");
              const preview = report.issues.slice(0, 3).map((item) => item.message).join(" · ");
              if (!report.repairable) return setResult("error", `Found ${report.issues.length} issue(s), but none can be repaired automatically. ${preview}`);
              if (!window.confirm(`Found ${report.issues.length} integration record issue(s). Repair ${report.repairable} safe stale record(s) now?`)) return setResult("working", `Found ${report.issues.length} issue(s). ${preview}`);
              const result = await management("/reconcile", { method: "POST", body: "{}" });
              const remaining = result.after?.issues?.length || 0;
              setResult(remaining ? "error" : "success", `Repaired ${result.repaired?.length || 0} stale record(s). ${remaining ? `${remaining} issue(s) still require review.` : "No reconciliation issues remain."}`);
              await refreshInstalledIntegrations();
              document.querySelector("#refresh-button")?.click();
            } catch (error) { setResult("error", error.message); }
            finally { integrationReconcile.disabled = false; }
          }

          integrationRefresh?.addEventListener("click", refreshInstalledIntegrations);
          integrationReconcile?.addEventListener("click", reconcileInstalledIntegrations);
          ''')

          rep("public/index.html", '          <button class="button button-secondary" id="installed-integrations-refresh" type="button">Refresh integrations</button>\n', '''          <div class="button-row">
                    <button class="button button-secondary" id="installed-integrations-reconcile" type="button">Scan stale records</button>
                    <button class="button button-secondary" id="installed-integrations-refresh" type="button">Refresh integrations</button>
                  </div>
          ''')

          testfile = "test/multiarch-native-integration.test.js"
          rep(testfile, 'import { driverLaunchCommand, pyInstallerOnedirEnvironment, wrapArm64HelperExecutables } from "../src/native-integrations/service.js";\n', 'import { driverLaunchCommand, packageExecutable, pyInstallerOnedirEnvironment, wrapArm64HelperExecutables } from "../src/native-integrations/service.js";\n')
          rep(testfile, 'assert.equal(env._PYI_PARENT_PROCESS_LEVEL, "-1");', 'assert.equal(env._PYI_PARENT_PROCESS_LEVEL, "0");')
          p = Path(testfile)
          p.write_text(p.read_text(encoding="utf-8") + r'''

test("documented bin/driver.js packages launch through Node", () => {
  const root = fs.mkdtempSync(path.join(os.tmpdir(), "ucvr-node-driver-"));
  try {
    const bin = path.join(root, "bin");
    const driver = path.join(bin, "driver.js");
    fs.mkdirSync(bin, { recursive: true });
    fs.writeFileSync(driver, "console.log('driver');\n", { mode: 0o644 });
    assert.equal(packageExecutable(root), driver);
    const launch = driverLaunchCommand({ driver_id: "node-driver", executable: driver, architecture: "script" }, { runtimeArch: "x64" });
    assert.equal(launch.command, process.execPath);
    assert.deepEqual(launch.args, [driver]);
  } finally { fs.rmSync(root, { recursive: true, force: true }); }
});
''', encoding="utf-8")

          Path("test/v0147-regression.test.js").write_text(r'''import assert from "node:assert/strict";
import fs from "node:fs";
import test from "node:test";
import { integrationReconciliationReport } from "../src/api/installed-integration-management.js";

const entrypoint = fs.readFileSync(new URL("../docker-entrypoint.sh", import.meta.url), "utf8");
const nativeService = fs.readFileSync(new URL("../src/native-integrations/service.js", import.meta.url), "utf8");

test("DinD prepares a writable cgroup v2 hierarchy", () => {
  assert.match(entrypoint, /prepare_dind_cgroups/);
  assert.match(entrypoint, /cgroup\.subtree_control/);
  assert.match(entrypoint, /mount -t cgroup2/);
});

test("custom package compatibility keeps min_core_api informational", () => {
  assert.match(nativeService, /min_core_api is informational and is not enforced/);
  assert.doesNotMatch(nativeService, /throw Object\.assign\(new Error\(`Integration requires Core API/);
});

function mock(records, native = [], external = []) {
  const byId = new Map(records.map((item) => [item.id, item]));
  return { db: { listIntegrations: () => [...records], getIntegration: (id) => byId.get(id) || null, listConfiguredEntities: () => [], listActivities: () => [], listMacros: () => [] }, nativeIntegrations: { state: { integrations: Object.fromEntries(native.map((item) => [item.driver_id, item])) } }, externalIntegrations: { state: { integrations: Object.fromEntries(external.map((item) => [item.driver_id, item])) } } };
}

test("reconciliation exposes stale and duplicate driver records", () => {
  const stale = integrationReconciliationReport(mock([{ id: "stale", driver_id: "stale", driver_type: "CUSTOM", metadata: { native_runtime: true } }]));
  assert.equal(stale.issues.some((item) => item.type === "stale_native_database_record" && item.repairable), true);
  const dup = integrationReconciliationReport(mock([{ id: "one", driver_id: "dup", driver_type: "CUSTOM", metadata: {} }, { id: "two", driver_id: "dup", driver_type: "EXTERNAL", metadata: {} }]));
  assert.equal(dup.issues.some((item) => item.type === "duplicate_driver_id" && !item.repairable), true);
});
''', encoding="utf-8")

          Path("VERSION").write_text("0.14.7\n", encoding="utf-8")
          for f in ["package.json", "package-lock.json"]:
              p = Path(f); data = json.loads(p.read_text(encoding="utf-8")); data["version"] = "0.14.7"
              if f == "package-lock.json": data["packages"][""]["version"] = "0.14.7"
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          for f in [".github/workflows/repair-v0147.yml", ".github/workflows/repair-v0147b.yml"]:
              Path(f).unlink(missing_ok=True)
          PY
      - name: Test
        run: |
          npm ci
          npm run ci
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Home Assistant integration installs and add stale-record repair"
          git push origin HEAD:main
