name: Apply v0.14.12 Supervisor update fix

on:
  push:
    branches:
      - fix/v0.14.12-ha-supervisor-updates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.14.12-ha-supervisor-updates
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply Supervisor-managed update routing
        shell: python
        run: |
          from pathlib import Path

          service_path = Path('src/system-update/service.js')
          service = service_path.read_text()
          service = service.replace(
              'import { nowIso, slug } from "../shared/util.js";\n',
              'import { nowIso, slug } from "../shared/util.js";\nimport { SupervisorUpdateAdapter, supervisorManagedEnvironment } from "./supervisor.js";\n'
          )
          service = service.replace(
              '    this.repository = options.repository || process.env.UCVR_UPDATE_REPOSITORY || DEFAULT_REPOSITORY;\n',
              '    this.repository = options.repository || process.env.UCVR_UPDATE_REPOSITORY || DEFAULT_REPOSITORY;\n'
              '    this.supervisorManaged = supervisorManagedEnvironment();\n'
              '    this.supervisor = this.supervisorManaged ? new SupervisorUpdateAdapter(options.supervisor || {}) : null;\n'
          )
          service = service.replace(
              '  channel() {\n    return this.platform.configuration.get("software_update").channel === "TESTING" ? "TESTING" : "DEFAULT";\n  }\n\n  activeRelease() {\n    return readJson(this.activeFile, null);\n  }',
              '  channel() {\n    if (this.supervisorManaged) return "DEFAULT";\n    return this.platform.configuration.get("software_update").channel === "TESTING" ? "TESTING" : "DEFAULT";\n  }\n\n  activeRelease() {\n    if (this.supervisorManaged) return null;\n    return readJson(this.activeFile, null);\n  }'
          )
          service = service.replace(
              '      active_release: this.activeRelease(),\n      last_checked_at: this.cache?.checkedAt || null,',
              '      active_release: this.activeRelease(),\n      supervisor_managed: this.supervisorManaged,\n      supervisor_installed_version: this.supervisor?.installedVersion || null,\n      supervisor_latest_version: this.supervisor?.latestVersion || null,\n      last_checked_at: this.cache?.checkedAt || null,'
          )
          service = service.replace(
              '      const update = channel === "TESTING" ? await this.#testingUpdate() : await this.#stableUpdate();',
              '      const update = this.supervisor\n        ? await this.supervisor.check(force)\n        : channel === "TESTING" ? await this.#testingUpdate() : await this.#stableUpdate();'
          )
          old_action = '''  async action(updateId) {
    await this.check(false);
    const update = this.cache?.updates?.find((item) => item.id === updateId);
    if (!update) throw Object.assign(new Error(`Unknown software update ${updateId}`), { status: 404 });
    if (this.tasks.has(updateId)) {
      const task = this.tasks.get(updateId);
      return { code: "OK", action: task.action, state: task.action === "INSTALL" ? "START" : "DOWNLOAD", update_id: updateId };
    }
    const downloaded = this.#downloadPath(update);
    if (!fs.existsSync(downloaded)) {
      const task = { action: "DOWNLOAD" };
      this.tasks.set(updateId, task);
      this.#download(update, downloaded).finally(() => this.tasks.delete(updateId));
      return { code: "OK", action: "DOWNLOAD", state: "DOWNLOAD", update_id: updateId };
    }
    const task = { action: "INSTALL" };
    this.tasks.set(updateId, task);
    this.#install(update, downloaded).finally(() => this.tasks.delete(updateId));
    return { code: "OK", action: "INSTALL", state: "START", update_id: updateId };
  }'''
          new_action = '''  async action(updateId) {
    await this.check(false);
    const update = this.cache?.updates?.find((item) => item.id === updateId);
    if (!update) throw Object.assign(new Error(`Unknown software update ${updateId}`), { status: 404 });
    if (this.tasks.has(updateId)) {
      const task = this.tasks.get(updateId);
      return { code: "OK", action: task.action, state: task.action === "INSTALL" ? "START" : "DOWNLOAD", update_id: updateId };
    }
    const downloaded = this.#downloadPath(update);
    if (!fs.existsSync(downloaded)) {
      const task = { action: "DOWNLOAD" };
      this.tasks.set(updateId, task);
      const prepare = this.supervisor
        ? this.#prepareSupervisorUpdate(update, downloaded)
        : this.#download(update, downloaded);
      prepare.finally(() => this.tasks.delete(updateId));
      return { code: "OK", action: "DOWNLOAD", state: "DOWNLOAD", update_id: updateId };
    }
    const task = { action: "INSTALL" };
    this.tasks.set(updateId, task);
    const install = this.supervisor
      ? this.#installSupervisor(update, downloaded)
      : this.#install(update, downloaded);
    install.finally(() => this.tasks.delete(updateId));
    return { code: "OK", action: "INSTALL", state: "START", update_id: updateId };
  }'''
          if old_action not in service:
              raise SystemExit('Expected SystemUpdateService.action implementation not found')
          service = service.replace(old_action, new_action)
          service = service.replace(
              '      installed_version: this.platform.version,',
              '      installed_version: this.supervisor?.installedVersion || this.platform.version,'
          )
          marker = '  async #download(update, target) {'
          helpers = '''  async #prepareSupervisorUpdate(update, target) {
    try {
      this.#publish({ state: "DOWNLOAD", update_id: update.id, download_percent: 0 }, "START");
      atomicJson(target, {
        source: "HOME_ASSISTANT_SUPERVISOR",
        update_id: update.id,
        version: update.version,
        prepared_at: nowIso()
      });
      this.cache = this.cache ? {
        ...this.cache,
        updates: this.cache.updates.map((item) => item.id === update.id ? this.#withDownloadState(item) : item)
      } : this.cache;
      this.#publish({ state: "DOWNLOAD", update_id: update.id, download_percent: 100 });
      this.#publish({ state: "SUCCESS", update_id: update.id });
    } catch (error) {
      fs.rmSync(target, { force: true });
      this.#publish({ state: "FAILURE", update_id: update.id, error: error.message });
      log.error(`Supervisor update preparation failed: ${error.message}`);
    }
  }

  async #installSupervisor(update, markerFile) {
    try {
      this.#publish({ state: "START", update_id: update.id }, "START");
      const result = await this.supervisor.install(update);
      fs.rmSync(markerFile, { force: true });
      this.#publish({ state: "PROGRESS", update_id: update.id, progress_percent: 100 });
      this.#publish({ state: "DONE", update_id: update.id });
      log.info(`Handed software update ${update.id} to Home Assistant Supervisor${result?.job_id ? ` (job ${result.job_id})` : ""}`);
    } catch (error) {
      this.#publish({ state: "FAILURE", update_id: update.id, error: error.message });
      log.error(`Home Assistant Supervisor update failed: ${error.message}`);
    }
  }

'''
          if marker not in service:
              raise SystemExit('Expected download method marker not found')
          service = service.replace(marker, helpers + marker)
          service_path.write_text(service)

          supervisor_path = Path('src/system-update/supervisor.js')
          supervisor = supervisor_path.read_text()
          supervisor = supervisor.replace(
              '  async check() {\n    const info = await this.#request("/addons/self/info");',
              '  async check(force = false) {\n    if (force) await this.#request("/store/reload", { method: "POST" });\n    const info = await this.#request("/addons/self/info");'
          )
          supervisor_path.write_text(supervisor)

          launcher_path = Path('launcher.js')
          launcher = launcher_path.read_text()
          launcher = launcher.replace(
              'const restartExitCode = 75;\n',
              'const restartExitCode = 75;\nconst supervisorManaged = ["1", "true", "yes", "on"].includes(String(process.env.UCVR_SUPERVISOR_MANAGED || "").trim().toLowerCase());\n'
          )
          launcher = launcher.replace(
              'function readActiveApplication() {\n  try {',
              'function readActiveApplication() {\n  if (supervisorManaged) return { root: launcherRoot, metadata: null };\n  try {'
          )
          launcher = launcher.replace(
              'while (!stopping) {\n',
              'if (supervisorManaged && fs.existsSync(activeFile)) {\n  console.log("UC Virtual Remote launcher: Home Assistant Supervisor manages this installation; ignoring persisted in-app release metadata");\n}\n\nwhile (!stopping) {\n'
          )
          launcher_path.write_text(launcher)

          test_path = Path('test/integration-install-regression.test.js')
          test = test_path.read_text()
          test = test.replace(
              'const simulator = fs.readFileSync(new URL("../web-configurator/public/assets/ucvr-simulator.js", import.meta.url), "utf8");\n',
              'const simulator = fs.readFileSync(new URL("../web-configurator/public/assets/ucvr-simulator.js", import.meta.url), "utf8");\n'
              'const launcher = fs.readFileSync(new URL("../launcher.js", import.meta.url), "utf8");\n'
              'const systemUpdate = fs.readFileSync(new URL("../src/system-update/service.js", import.meta.url), "utf8");\n'
              'const supervisorUpdate = fs.readFileSync(new URL("../src/system-update/supervisor.js", import.meta.url), "utf8");\n'
          )
          test += '''

test("Home Assistant add-on updates are delegated to Supervisor without activating persisted inner releases", () => {
  assert.match(launcher, /UCVR_SUPERVISOR_MANAGED/);
  assert.match(launcher, /if \(supervisorManaged\) return \{ root: launcherRoot, metadata: null \}/);
  assert.match(systemUpdate, /SupervisorUpdateAdapter/);
  assert.match(systemUpdate, /#prepareSupervisorUpdate/);
  assert.match(systemUpdate, /#installSupervisor/);
  assert.match(supervisorUpdate, /\/addons\/self\/info/);
  assert.match(supervisorUpdate, /\/store\/addons\/self\/update/);
  assert.match(supervisorUpdate, /background: true/);
});
'''
          test_path.write_text(test)
      - name: Bump version
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.14.12 --no-git-tag-version
          printf '0.14.12\n' > VERSION
      - name: Validate final source
        run: npm run ci
      - name: Remove temporary patcher
        run: rm .github/workflows/apply-v01412-ha-supervisor-update.yml
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Home Assistant Supervisor-managed updates in v0.14.12"
          git push origin HEAD:fix/v0.14.12-ha-supervisor-updates
