name: Repair v0.14.7 integration runtime

on:
  push:
    branches:
      - repair/v0.14.7

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply runtime and management fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:120]!r}")
              text = text.replace(old, new, count)
              p.write_text(text, encoding="utf-8")

          native = "src/native-integrations/service.js"
          replace(native,
          '''function packageExecutable(root) {
            const standard = path.join(root, "bin", "driver");
            if (fs.existsSync(standard) && fs.statSync(standard).isFile()) return standard;
            const bin = path.join(root, "bin");
            if (fs.existsSync(bin)) {
              const candidates = fs.readdirSync(bin)
                .map((name) => path.join(bin, name))
                .filter((filename) => {
                  try { return fs.statSync(filename).isFile() && (fs.statSync(filename).mode & 0o111); }
                  catch { return false; }
                });
              if (candidates.length === 1) return candidates[0];
            }
            throw Object.assign(new Error("Integration archive is missing the standard bin/driver executable"), { status: 422 });
          }
          ''',
          '''export function packageExecutable(root) {
            const standard = path.join(root, "bin", "driver");
            if (fs.existsSync(standard) && fs.statSync(standard).isFile()) return standard;
            const nodeStandard = path.join(root, "bin", "driver.js");
            if (fs.existsSync(nodeStandard) && fs.statSync(nodeStandard).isFile()) return nodeStandard;
            const bin = path.join(root, "bin");
            if (fs.existsSync(bin)) {
              const candidates = fs.readdirSync(bin)
                .map((name) => path.join(bin, name))
                .filter((filename) => {
                  try { return fs.statSync(filename).isFile() && (fs.statSync(filename).mode & 0o111); }
                  catch { return false; }
                });
              if (candidates.length === 1) return candidates[0];
            }
            throw Object.assign(new Error("Integration archive is missing bin/driver or bin/driver.js"), { status: 422 });
          }
          ''')

          replace(native,
          '''  // PyInstaller 6.x onedir applications normally restart their bootloader once
            // after modifying LD_LIBRARY_PATH. Under process-scoped QEMU that guest
            // execve would escape the emulator. Seed the post-restart environment so the
            // bootloader proceeds directly as its main process instead.
            const inheritedLd = String(options.ldLibraryPath ?? process.env.LD_LIBRARY_PATH ?? "").trim();
            return {
              _PYI_ARCHIVE_FILE: executable,
              _PYI_PARENT_PROCESS_LEVEL: "-1",
              LD_LIBRARY_PATH: [internalDir, inheritedLd].filter(Boolean).join(":")
            };
          ''',
          '''  // POSIX PyInstaller onedir applications normally restart their bootloader once
            // after modifying LD_LIBRARY_PATH. Under process-scoped QEMU that guest
            // execve would escape the emulator. Seed the environment expected after the
            // restart. Older PyInstaller bootloaders accept only 0/1 here; 0 identifies
            // the post-restart main application process and is compatible across the
            // bootloader generations used by UC integration packages.
            const inheritedLd = String(options.ldLibraryPath ?? process.env.LD_LIBRARY_PATH ?? "").trim();
            return {
              _PYI_ARCHIVE_FILE: executable,
              _PYI_PARENT_PROCESS_LEVEL: "0",
              LD_LIBRARY_PATH: [internalDir, inheritedLd].filter(Boolean).join(":")
            };
          ''')

          replace(native,
          '''export function driverLaunchCommand(record, options = {}) {
            const executable = String(record?.executable || "");
            const architecture = record?.architecture
              || (executable ? executableArchitecture(executable) : null);
            const runtimeArch = String(options.runtimeArch || process.arch);
            if (architecture !== "arm64" || runtimeArch === "arm64") {
              return { command: executable, args: [], emulated: false, architecture: architecture || "script" };
            }
          ''',
          '''export function driverLaunchCommand(record, options = {}) {
            const executable = String(record?.executable || "");
            const architecture = record?.architecture
              || (executable ? executableArchitecture(executable) : null);
            const runtimeArch = String(options.runtimeArch || process.arch);
            if (path.extname(executable).toLowerCase() === ".js") {
              return { command: process.execPath, args: [executable], emulated: false, architecture: "script" };
            }
            if (architecture !== "arm64" || runtimeArch === "arm64") {
              return { command: executable, args: [], emulated: false, architecture: architecture || "script" };
            }
          ''')

          replace(native,
          '''      if (metadata.min_core_api && !versionAtLeast(this.platform.restCoreApiVersion, metadata.min_core_api)) {
                throw Object.assign(new Error(`Integration requires Core API ${metadata.min_core_api}, this runtime provides ${this.platform.restCoreApiVersion}`), { status: 409 });
              }
          ''',
          '''      if (metadata.min_core_api && !versionAtLeast(this.platform.restCoreApiVersion, metadata.min_core_api)) {
                // The published UC custom-driver contract currently treats min_core_api
                // as informational. Preserve it and make the mismatch visible in logs,
                // but do not reject an otherwise valid package before it can start.
                log.warn(`Integration ${driverId} declares Core API ${metadata.min_core_api}; runtime reports ${this.platform.restCoreApiVersion}. min_core_api is informational and is not enforced.`);
              }
          ''')

          replace(native,
          '''        throw new Error(`Native integration ${record.driver_id} did not open Integration API port ${record.port}.${tail ? ` Last output: ${tail.slice(-2000)}` : ""}`);
          ''',
          '''        throw Object.assign(
                  new Error(`Native integration ${record.driver_id} did not open Integration API port ${record.port}.${tail ? ` Last output: ${tail.slice(-2000)}` : ""}`),
                  { status: 422, code: "INTEGRATION_START_FAILED" }
                );
          ''')

          entrypoint = "docker-entrypoint.sh"
          marker = '''require_dind_namespace_access() {
            if command -v unshare >/dev/null 2>&1 && unshare --mount /bin/true >/dev/null 2>&1; then
              return 0
            fi

            echo "UC Virtual Remote: internal Docker cannot create mount namespaces in this container." >&2
            echo "UC Virtual Remote: registry/external integrations require CAP_SYS_ADMIN and an unconfined seccomp/AppArmor policy in the top-level container." >&2
            echo "UC Virtual Remote: Home Assistant add-on packages must declare privileged: [SYS_ADMIN]; full_access does not grant Linux capabilities." >&2
            echo "UC Virtual Remote: disabling Home Assistant Protection mode only enables full_access device permissions and does not replace SYS_ADMIN." >&2
            echo "UC Virtual Remote: standalone Docker users should start the appliance with --privileged." >&2
            exit 1
          }
          '''
          replacement = marker + '''
          prepare_dind_cgroups() {
            export container=docker

            # cgroup v2 needs a writable delegated hierarchy for runc. Home
            # Assistant can expose the cgroup mount read-only even when the
            # add-on has CAP_SYS_ADMIN, so first try to make that mount usable
            # inside this mount namespace.
            if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
              probe="/sys/fs/cgroup/.ucvr-cgroup-probe-$$"
              if ! mkdir "$probe" >/dev/null 2>&1; then
                mount -o remount,rw /sys/fs/cgroup >/dev/null 2>&1 || true
              fi
              if ! mkdir "$probe" >/dev/null 2>&1; then
                # A fresh cgroup2 mount is the DinD fallback when the inherited
                # bind mount cannot be remounted. The cgroup namespace still
                # limits visibility to the add-on's delegated subtree.
                mount -t cgroup2 -o rw,nosuid,nodev,noexec cgroup2 /sys/fs/cgroup >/dev/null 2>&1 || true
              fi
              if ! mkdir "$probe" >/dev/null 2>&1; then
                echo "UC Virtual Remote: internal Docker cannot create child cgroups under /sys/fs/cgroup." >&2
                echo "UC Virtual Remote: the cgroup v2 hierarchy is still read-only after requesting SYS_ADMIN." >&2
                echo "UC Virtual Remote: registry integrations cannot run until the outer runtime provides a writable/delegated cgroup hierarchy." >&2
                exit 1
              fi
              rmdir "$probe" >/dev/null 2>&1 || true

              # Follow Docker's DinD cgroup-v2 setup: move processes out of
              # the namespace root and enable all delegated controllers.
              mkdir -p /sys/fs/cgroup/init
              attempts=0
              enabled=0
              while [ "$attempts" -lt 5 ]; do
                xargs -rn1 < /sys/fs/cgroup/cgroup.procs > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
                if sed -e 's/ / +/g' -e 's/^/+/' < /sys/fs/cgroup/cgroup.controllers > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null; then
                  enabled=1
                  break
                fi
                attempts=$((attempts + 1))
              done
              if [ "$enabled" != "1" ]; then
                echo "UC Virtual Remote: unable to delegate cgroup v2 controllers to internal Docker." >&2
                exit 1
              fi
            fi

            mount --make-rshared / >/dev/null 2>&1 || true
          }
          '''
          replace(entrypoint, marker, replacement)
          replace(entrypoint,
          '''  require_dind_namespace_access
            mkdir -p "$DIND_DATA_ROOT" /var/run/docker
          ''',
          '''  require_dind_namespace_access
            prepare_dind_cgroups
            mkdir -p "$DIND_DATA_ROOT" /var/run/docker
          ''')

          mgmt = "src/api/installed-integration-management.js"
          anchor = '''export async function installedIntegrationItems(platform) {
          '''
          scanner = r'''function reconciliationDriverId(record) {
            return String(record?.driver_id || record?.metadata?.driver_id || record?.id || "");
          }

          function isManagementInternalRecord(record) {
            return Boolean(record?.metadata?.internal || String(record?.driver_type || "").toUpperCase() === "INTERNAL");
          }

          function integrationReferenceCount(platform, integrationId) {
            const id = String(integrationId || "");
            return (platform.db.listConfiguredEntities(id)?.length || 0)
              + platform.db.listActivities().filter((item) => String(item.integration_id || "") === id).length
              + platform.db.listMacros().filter((item) => String(item.integration_id || "") === id).length;
          }

          export function integrationReconciliationReport(platform) {
            const records = platform.db.listIntegrations();
            const nativeRecords = Object.values(platform.nativeIntegrations?.state?.integrations || {});
            const externalRecords = Object.values(platform.externalIntegrations?.state?.integrations || {});
            const nativeIds = new Set(nativeRecords.map((item) => String(item.driver_id || "")).filter(Boolean));
            const externalIds = new Set(externalRecords.map((item) => String(item.driver_id || "")).filter(Boolean));
            const canonicalRecords = records.filter((item) => !isManagementInternalRecord(item) && !item.metadata?.instance_alias);
            const canonicalDriverIds = new Set(canonicalRecords.map(reconciliationDriverId).filter(Boolean));
            const issues = [];

            for (const record of records) {
              if (record?.metadata?.instance_alias) {
                const target = String(record.metadata.connection_record_id || "");
                if (!target || !platform.db.getIntegration(target)) {
                  issues.push({
                    type: "orphan_instance_alias",
                    record_id: record.id,
                    driver_id: reconciliationDriverId(record),
                    repairable: true,
                    message: `Instance alias ${record.id} points to missing integration ${target || "(none)"}`
                  });
                }
                continue;
              }
              if (isManagementInternalRecord(record)) continue;
              const id = reconciliationDriverId(record);
              const references = integrationReferenceCount(platform, record.id);
              if (record.metadata?.native_runtime && !nativeIds.has(id)) {
                issues.push({
                  type: "stale_native_database_record",
                  record_id: record.id,
                  driver_id: id,
                  references,
                  repairable: references === 0,
                  message: `Database contains native driver ${id}, but its native package/runtime state is missing`
                });
              }
              if ((record.metadata?.registry_managed || record.registry_managed) && !externalIds.has(id)) {
                issues.push({
                  type: "stale_external_database_record",
                  record_id: record.id,
                  driver_id: id,
                  references,
                  repairable: references === 0,
                  message: `Database contains managed driver ${id}, but its container runtime state is missing`
                });
              }
            }

            const grouped = new Map();
            for (const record of canonicalRecords) {
              const id = reconciliationDriverId(record);
              if (!id) continue;
              const values = grouped.get(id) || [];
              values.push(record);
              grouped.set(id, values);
            }
            for (const [id, values] of grouped) {
              if (values.length < 2) continue;
              issues.push({
                type: "duplicate_driver_id",
                driver_id: id,
                record_ids: values.map((item) => item.id),
                repairable: false,
                message: `Driver ID ${id} is used by ${values.length} database records: ${values.map((item) => item.id).join(", ")}`
              });
            }

            for (const record of nativeRecords) {
              if (record.driver_id && !canonicalDriverIds.has(String(record.driver_id))) {
                issues.push({
                  type: "orphan_native_runtime",
                  driver_id: String(record.driver_id),
                  repairable: false,
                  message: `Native runtime state exists for ${record.driver_id}, but no database driver record exists`
                });
              }
            }
            for (const record of externalRecords) {
              if (record.driver_id && !canonicalDriverIds.has(String(record.driver_id))) {
                issues.push({
                  type: "orphan_external_runtime",
                  driver_id: String(record.driver_id),
                  container: record.container || null,
                  repairable: false,
                  message: `Managed container state exists for ${record.driver_id}, but no database driver record exists`
                });
              }
            }

            return {
              healthy: issues.length === 0,
              database_records: canonicalRecords.length,
              native_runtime_records: nativeRecords.length,
              external_runtime_records: externalRecords.length,
              repairable: issues.filter((item) => item.repairable).length,
              issues
            };
          }

          export async function repairIntegrationReconciliation(platform) {
            const before = integrationReconciliationReport(platform);
            const repaired = [];
            for (const issue of before.issues.filter((item) => item.repairable)) {
              if (issue.type === "orphan_instance_alias") {
                if (platform.db.deleteIntegration(issue.record_id)) repaired.push(issue);
                continue;
              }
              if (["stale_native_database_record", "stale_external_database_record"].includes(issue.type)) {
                if (await platform.integrations.remove(issue.record_id).catch(() => false)) repaired.push(issue);
              }
            }
            return { repaired, before, after: integrationReconciliationReport(platform) };
          }

          '''
          replace(mgmt, anchor, scanner + anchor)

          replace(mgmt,
          '''  const matched = route(pathname);
            if (!matched) return json(response, 404, { error: "Not found" });

            if (request.method === "OPTIONS") {
          ''',
          '''  const matched = route(pathname);
            if (!matched) return json(response, 404, { error: "Not found" });

            if (pathname === `${ROUTE_ROOT}/reconcile` && request.method === "GET") {
              return json(response, 200, integrationReconciliationReport(platform));
            }
            if (pathname === `${ROUTE_ROOT}/reconcile` && request.method === "POST") {
              return json(response, 200, await repairIntegrationReconciliation(platform));
            }

            if (request.method === "OPTIONS") {
          ''')

          ui = "public/integrations-management.js"
          replace(ui,
          '''const integrationRefresh = document.querySelector("#installed-integrations-refresh");
          ''',
          '''const integrationRefresh = document.querySelector("#installed-integrations-refresh");
          const integrationReconcile = document.querySelector("#installed-integrations-reconcile");
          ''')

          replace(ui,
          '''integrationRefresh?.addEventListener("click", refreshInstalledIntegrations);
          ''',
          '''async function reconcileInstalledIntegrations() {
            if (!integrationReconcile) return;
            integrationReconcile.disabled = true;
            setResult("working", "Scanning integration records…");
            try {
              const report = await management("/reconcile");
              if (report.healthy) {
                setResult("success", "No stale, orphaned, or duplicate integration records were found.");
                return;
              }
              const preview = report.issues.slice(0, 3).map((item) => item.message).join(" · ");
              if (!report.repairable) {
                setResult("error", `Found ${report.issues.length} issue(s), but none can be repaired automatically. ${preview}`);
                return;
              }
              if (!window.confirm(`Found ${report.issues.length} integration record issue(s). ${report.repairable} stale record(s) can be safely removed automatically. Repair them now?`)) {
                setResult("working", `Found ${report.issues.length} issue(s). ${preview}`);
                return;
              }
              const result = await management("/reconcile", { method: "POST", body: "{}" });
              const remaining = result.after?.issues?.length || 0;
              setResult(remaining ? "error" : "success", `Repaired ${result.repaired?.length || 0} stale record(s). ${remaining ? `${remaining} issue(s) still require review.` : "No reconciliation issues remain."}`);
              await refreshInstalledIntegrations();
              document.querySelector("#refresh-button")?.click();
            } catch (error) {
              setResult("error", error.message);
            } finally {
              integrationReconcile.disabled = false;
            }
          }

          integrationRefresh?.addEventListener("click", refreshInstalledIntegrations);
          integrationReconcile?.addEventListener("click", reconcileInstalledIntegrations);
          ''')

          html = "public/index.html"
          replace(html,
          '''          <button class="button button-secondary" id="installed-integrations-refresh" type="button">Refresh integrations</button>
          ''',
          '''          <div class="button-row">
                    <button class="button button-secondary" id="installed-integrations-reconcile" type="button">Scan stale records</button>
                    <button class="button button-secondary" id="installed-integrations-refresh" type="button">Refresh integrations</button>
                  </div>
          ''')

          tests = "test/multiarch-native-integration.test.js"
          replace(tests,
          '''import { driverLaunchCommand, pyInstallerOnedirEnvironment, wrapArm64HelperExecutables } from "../src/native-integrations/service.js";
          ''',
          '''import { driverLaunchCommand, packageExecutable, pyInstallerOnedirEnvironment, wrapArm64HelperExecutables } from "../src/native-integrations/service.js";
          ''')
          replace(tests, 'assert.equal(env._PYI_PARENT_PROCESS_LEVEL, "-1");', 'assert.equal(env._PYI_PARENT_PROCESS_LEVEL, "0");')
          append = r'''

test("documented bin/driver.js packages launch through Node", () => {
  const root = fs.mkdtempSync(path.join(os.tmpdir(), "ucvr-node-driver-"));
  try {
    const bin = path.join(root, "bin");
    const driver = path.join(bin, "driver.js");
    fs.mkdirSync(bin, { recursive: true });
    fs.writeFileSync(driver, "console.log('driver');\n", { mode: 0o644 });
    assert.equal(packageExecutable(root), driver);
    const launch = driverLaunchCommand({ driver_id: "node-driver", executable: driver, architecture: "script" }, { runtimeArch: "x64" });
    assert.equal(launch.command, process.execPath);
    assert.deepEqual(launch.args, [driver]);
    assert.equal(launch.emulated, false);
    assert.equal(launch.architecture, "script");
  } finally {
    fs.rmSync(root, { recursive: true, force: true });
  }
});
'''
          Path(tests).write_text(Path(tests).read_text(encoding="utf-8") + append, encoding="utf-8")

          regression = "test/integration-runtime-ui-regression.test.js"
          replace(regression,
          '''const entrypoint = fs.readFileSync(new URL("../docker-entrypoint.sh", import.meta.url), "utf8");
          ''',
          '''const entrypoint = fs.readFileSync(new URL("../docker-entrypoint.sh", import.meta.url), "utf8");
          const nativeService = fs.readFileSync(new URL("../src/native-integrations/service.js", import.meta.url), "utf8");
          ''')
          replace(regression,
          '''  assert.match(entrypoint, /disable Protection mode/);
          });
          ''',
          '''  assert.match(entrypoint, /CAP_SYS_ADMIN/);
            assert.match(entrypoint, /prepare_dind_cgroups/);
            assert.match(entrypoint, /cgroup\.subtree_control/);
          });

          test("custom integration compatibility follows the published package contract", () => {
            assert.match(nativeService, /bin.*driver\.js/);
            assert.match(nativeService, /min_core_api is informational and is not enforced/);
            assert.doesNotMatch(nativeService, /throw Object\.assign\(new Error\(`Integration requires Core API/);
          });
          ''')

          Path("test/integration-reconciliation.test.js").write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import { integrationReconciliationReport } from "../src/api/installed-integration-management.js";

function platform(records, native = [], external = []) {
  const byId = new Map(records.map((item) => [item.id, item]));
  return {
    db: {
      listIntegrations: () => [...records],
      getIntegration: (id) => byId.get(id) || null,
      listConfiguredEntities: () => [],
      listActivities: () => [],
      listMacros: () => []
    },
    nativeIntegrations: { state: { integrations: Object.fromEntries(native.map((item) => [item.driver_id, item])) } },
    externalIntegrations: { state: { integrations: Object.fromEntries(external.map((item) => [item.driver_id, item])) } }
  };
}

test("reconciliation detects stale managed database records and orphan aliases", () => {
  const report = integrationReconciliationReport(platform([
    { id: "stale", driver_id: "stale", driver_type: "CUSTOM", metadata: { native_runtime: true } },
    { id: "ghost.main", driver_id: "ghost.main", driver_type: "INTERNAL", metadata: { instance_alias: true, connection_record_id: "ghost" } }
  ]));
  assert.equal(report.issues.some((item) => item.type === "stale_native_database_record" && item.repairable), true);
  assert.equal(report.issues.some((item) => item.type === "orphan_instance_alias" && item.repairable), true);
});

test("reconciliation reports duplicate driver IDs without guessing which record to delete", () => {
  const report = integrationReconciliationReport(platform([
    { id: "one", driver_id: "dup", driver_type: "CUSTOM", metadata: {} },
    { id: "two", driver_id: "dup", driver_type: "EXTERNAL", metadata: {} }
  ]));
  const duplicate = report.issues.find((item) => item.type === "duplicate_driver_id");
  assert.ok(duplicate);
  assert.equal(duplicate.repairable, false);
  assert.deepEqual(duplicate.record_ids, ["one", "two"]);
});

test("reconciliation reports runtime state without a database record", () => {
  const report = integrationReconciliationReport(platform([], [{ driver_id: "native-orphan" }], [{ driver_id: "external-orphan", container: "ucvr-intg-orphan" }]));
  assert.equal(report.issues.some((item) => item.type === "orphan_native_runtime"), true);
  assert.equal(report.issues.some((item) => item.type === "orphan_external_runtime"), true);
});
''', encoding="utf-8")

          # Version bump.
          Path("VERSION").write_text("0.14.7\n", encoding="utf-8")
          for filename in ["package.json", "package-lock.json"]:
              p = Path(filename)
              data = json.loads(p.read_text(encoding="utf-8"))
              data["version"] = "0.14.7"
              if filename == "package-lock.json" and "" in data.get("packages", {}):
                  data["packages"][""]["version"] = "0.14.7"
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          # The workflow is one-shot; remove it from the repaired main commit.
          Path(".github/workflows/repair-v0147.yml").unlink()
          PY

      - name: Run source checks and tests
        run: |
          npm ci
          npm run ci

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Home Assistant integration installs and add stale-record repair"
          git push origin HEAD:main
