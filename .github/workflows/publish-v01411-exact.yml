name: Publish exact v0.14.11

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.11-exact'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 64e41b026215b20c0a14f57d0f6225e2099bc536
          fetch-depth: 0
      - name: Validate exact source
        run: |
          test "$(cat VERSION)" = "0.14.11"
          test "$(node -p "require('./package.json').version")" = "0.14.11"
          test "$(git rev-parse HEAD)" = "64e41b026215b20c0a14f57d0f6225e2099bc536"
      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.14.11 >/dev/null 2>&1; then
            gh release create v0.14.11 \
              --target 64e41b026215b20c0a14f57d0f6225e2099bc536 \
              --title "UC Virtual Remote v0.14.11" \
              --notes "Fixes HTTPS/TLS hangs in ARM64 PyInstaller custom integrations emulated on AMD64 by disabling incompatible ARM OpenSSL acceleration only for that emulated runtime. Also redacts setup secrets, OAuth codes and tokens from native integration subprocess logs."
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.11
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-64e41b0
      - name: Verify anonymous multiarch image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.11 | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
      - name: Remove temporary publisher
        run: |
          git checkout publish/v0.14.11-exact
          rm -f .github/workflows/publish-v01411-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.11 publisher"
          git push origin HEAD:publish/v0.14.11-exact
