name: Publish v0.14.5 retry

on:
  push:
    branches:
      - publish/v0.14.5-retry

permissions:
  contents: write

env:
  SOURCE_SHA: 7c70c188012e8c6b1e003d3dedf20dc8d1bc0192
  TAG: v0.14.5
  VERSION: 0.14.5

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git show "${SOURCE_SHA}:VERSION" | tr -d '\r\n')" = "${VERSION}"
          test "$(git show "${SOURCE_SHA}:package.json" | jq -r .version)" = "${VERSION}"

      - name: Create exact tag using git push
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$existing" ] && [ "$existing" != "$SOURCE_SHA" ]; then
            echo "$TAG already points to $existing instead of $SOURCE_SHA" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            git tag "$TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Dispatch release and Docker publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -nc \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            '{event_type:"publish-release",client_payload:{tag:$tag,version:$version,major_minor:"0.14",major:"0",stable:"true"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input - >/dev/null

      - name: Remove one-shot publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/publish-v0145-retry.yml'
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Remove temporary v0.14.5 publication retry' \
            -f sha="$sha" \
            -f branch=main >/dev/null
