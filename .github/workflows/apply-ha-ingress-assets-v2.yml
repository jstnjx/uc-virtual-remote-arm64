name: Apply HA Ingress asset fix

on:
  push:
    branches:
      - fix/ha-ingress-assets-v2

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-ha-ingress-assets-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ha-ingress-assets-v2
      - name: Patch frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          index_path = Path('public/index.html')
          index = index_path.read_text()
          index = index.replace('<meta name="ucvr-build" content="0.12.5">', '<meta name="ucvr-build" content="0.14.1">', 1)
          index = index.replace(
              '<title>UC Virtual Remote</title>',
              '''<title>UC Virtual Remote</title>
            <base id="ucvr-base" href="/">
            <script>
              (() => {
                const match = window.location.pathname.match(/^(\\/api\\/hassio_ingress\\/[^/]+)/);
                if (match) document.getElementById("ucvr-base").href = `${match[1]}/`;
              })();
            </script>''',
              1,
          )
          replacements = {
              'href="/styles.css?v=0.12.5"': 'href="styles.css?v=0.14.1"',
              'href="/integrations-management.css?v=0.12.5"': 'href="integrations-management.css?v=0.14.1"',
              'href="/management-navigation.css?v=0.12.5"': 'href="management-navigation.css?v=0.14.1"',
              'class="navbar-brand" href="/"': 'class="navbar-brand" href="./"',
              'id="open-configurator" href="/configurator/"': 'id="open-configurator" href="configurator/"',
              'src="/management-navigation.js?v=0.12.5"': 'src="management-navigation.js?v=0.14.1"',
              'src="/app.js?v=0.12.5"': 'src="app.js?v=0.14.1"',
              'src="/integrations-management.js?v=0.12.5"': 'src="integrations-management.js?v=0.14.1"',
          }
          for old, new in replacements.items():
              if old not in index:
                  raise SystemExit(f'index anchor missing: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index)

          app_path = Path('public/app.js')
          app = app_path.read_text()
          header = '/* UC Virtual Remote management landing page — SPDX-License-Identifier: MIT */\n'
          if header not in app:
              raise SystemExit('app header missing')
          app = app.replace(header, header + 'import { appUrl } from "./management-base.js";\n', 1)
          for old, new in {
              'fetch(`/management/${path}`': 'fetch(appUrl(`management/${path}`)',
              'fetch("/pub/status"': 'fetch(appUrl("pub/status")',
          }.items():
              if old not in app:
                  raise SystemExit(f'app fetch anchor missing: {old}')
              app = app.replace(old, new)
          app_path.write_text(app)

          integrations_path = Path('public/integrations-management.js')
          integrations = integrations_path.read_text()
          integrations = 'import { appUrl } from "./management-base.js";\n' + integrations
          old = 'fetch(`/management/installed-integrations${path}`'
          if old not in integrations:
              raise SystemExit('integration fetch anchor missing')
          integrations = integrations.replace(old, 'fetch(appUrl(`management/installed-integrations${path}`)', 1)
          integrations_path.write_text(integrations)

          Path('VERSION').write_text('0.14.1\n')
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '0.14.1'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          lock['version'] = '0.14.1'
          lock['packages']['']['version'] = '0.14.1'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')
          PY

          rm -f .github/workflows/apply-ha-ingress-assets-v2.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Home Assistant Ingress frontend paths"
          git push origin HEAD:fix/ha-ingress-assets-v2
