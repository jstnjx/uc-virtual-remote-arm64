name: Apply multiarch runtime patch

on:
  push:
    branches:
      - feature/multiarch-ha

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-multiarch-runtime]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/multiarch-ha
          fetch-depth: 0
      - name: Patch native integration launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/native-integrations/service.js')
          text = path.read_text()

          anchor = '''  } finally {
              fs.closeSync(handle);
            }
          }

          async function portAvailable'''
          helper = '''  } finally {
              fs.closeSync(handle);
            }
          }

          export function driverLaunchCommand(record, options = {}) {
            const executable = String(record?.executable || "");
            const architecture = record?.architecture && record.architecture !== "script"
              ? record.architecture
              : (executable ? executableArchitecture(executable) : null);
            const runtimeArch = String(options.runtimeArch || process.arch);
            if (architecture !== "arm64" || runtimeArch === "arm64") {
              return { command: executable, args: [], emulated: false, architecture: architecture || "script" };
            }
            if (!["x64", "amd64"].includes(runtimeArch)) {
              throw new Error(`ARM64 integration ${record?.driver_id || executable} cannot run on unsupported host architecture ${runtimeArch}`);
            }
            const emulator = String(options.emulator ?? process.env.UCVR_ARM64_EMULATOR ?? "/usr/local/bin/qemu-aarch64-static");
            const exists = options.exists || fs.existsSync;
            if (!emulator || !exists(emulator)) {
              throw new Error(`ARM64 integration ${record?.driver_id || executable} requires qemu-aarch64-static on ${runtimeArch}`);
            }
            const args = [];
            const ldPrefix = String(options.ldPrefix ?? process.env.UCVR_ARM64_LD_PREFIX ?? "").trim();
            if (ldPrefix) args.push("-L", ldPrefix);
            args.push(executable);
            return { command: emulator, args, emulated: true, architecture };
          }

          async function portAvailable'''
          if anchor not in text:
              raise SystemExit('architecture helper anchor not found')
          text = text.replace(anchor, helper, 1)

          old_spawn = '''    const child = spawn(record.executable, [], {
          '''
          new_spawn = '''    const launch = driverLaunchCommand(record);
              if (launch.emulated) {
                log.info(`Starting ARM64 integration ${record.driver_id} through ${path.basename(launch.command)} on ${process.arch}`);
              }
              const child = spawn(launch.command, launch.args, {
          '''
          if old_spawn not in text:
              raise SystemExit('driver spawn anchor not found')
          text = text.replace(old_spawn, new_spawn, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/native-integrations/service.js
          git diff --cached --check
          git commit -m "Run ARM64 integration binaries through scoped QEMU on amd64"
          git push origin HEAD:feature/multiarch-ha
