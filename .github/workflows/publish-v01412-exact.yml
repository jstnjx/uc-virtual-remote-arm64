name: Publish exact v0.14.12

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.head_ref == 'publish/v0.14.12-exact'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a651610fc6adb4aca1c25ed4046fc26c07ffdd3f
          fetch-depth: 0
      - name: Validate exact source
        run: |
          test "$(cat VERSION)" = "0.14.12"
          test "$(node -p "require('./package.json').version")" = "0.14.12"
          test "$(git rev-parse HEAD)" = "a651610fc6adb4aca1c25ed4046fc26c07ffdd3f"
      - name: Create exact tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.14.12 >/dev/null 2>&1; then
            gh release create v0.14.12 \
              --target a651610fc6adb4aca1c25ed4046fc26c07ffdd3f \
              --title "UC Virtual Remote v0.14.12" \
              --notes "Fixes Home Assistant add-on/Core version mismatches by delegating software updates to Home Assistant Supervisor when UC Virtual Remote is packaged as an add-on. Standalone Docker installations retain the existing internal GitHub updater. Includes Supervisor update regression coverage."
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push exact release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.12
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14
            ghcr.io/jstnjx/uc-virtual-remote-arm64:0
            ghcr.io/jstnjx/uc-virtual-remote-arm64:latest
            ghcr.io/jstnjx/uc-virtual-remote-arm64:sha-a651610
      - name: Verify anonymous multiarch image
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect ghcr.io/jstnjx/uc-virtual-remote-arm64:0.14.12 | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
      - name: Remove temporary publisher
        run: |
          git checkout publish/v0.14.12-exact
          rm -f .github/workflows/publish-v01412-exact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary v0.14.12 publisher"
          git push origin HEAD:publish/v0.14.12-exact
