name: Fix multiarch script launch

on:
  push:
    branches:
      - feature/multiarch-ha

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[fix-multiarch-script-launch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/multiarch-ha
      - name: Fix script architecture selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/native-integrations/service.js')
          text = path.read_text()
          old = '''  const architecture = record?.architecture && record.architecture !== "script"
              ? record.architecture
              : (executable ? executableArchitecture(executable) : null);'''
          new = '''  const architecture = record?.architecture
              || (executable ? executableArchitecture(executable) : null);'''
          if old not in text:
              raise SystemExit('architecture selection anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/native-integrations/service.js
          git commit -m "Handle script integration launch architecture"
          git push origin HEAD:feature/multiarch-ha
