name: Apply v0.14.11 native log redaction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/v0.14.11-arm64-https'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.14.11-arm64-https
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Wire native runtime log redaction
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/native-integrations/service.js')
          source = path.read_text()

          import_anchor = 'import { runProcess } from "../shared/process.js";\n'
          import_line = 'import { redactIntegrationLogLine } from "../shared/log-redaction.js";\n'
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor not found')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          old = '''      for (const line of lines) {
                  if (!line) continue;
                  const output = `[${new Date().toISOString()}] ${level} ${line}\\n`;
                  try { fs.appendFileSync(filename, output); } catch {}
                  if (level === "ERROR") log.warn(`${driverId}: ${line}`);
                  else log.info(`${driverId}: ${line}`);
                }
              });
              stream?.once("end", () => {
                if (!pending) return;
                try { fs.appendFileSync(filename, `[${new Date().toISOString()}] ${level} ${pending}\\n`); } catch {}
              });'''
          new = '''      for (const line of lines) {
                  if (!line) continue;
                  const safeLine = redactIntegrationLogLine(line);
                  const output = `[${new Date().toISOString()}] ${level} ${safeLine}\\n`;
                  try { fs.appendFileSync(filename, output); } catch {}
                  if (level === "ERROR") log.warn(`${driverId}: ${safeLine}`);
                  else log.info(`${driverId}: ${safeLine}`);
                }
              });
              stream?.once("end", () => {
                if (!pending) return;
                const safePending = redactIntegrationLogLine(pending);
                try { fs.appendFileSync(filename, `[${new Date().toISOString()}] ${level} ${safePending}\\n`); } catch {}
              });'''
          if old not in source:
              raise SystemExit('pipe log anchor not found')
          source = source.replace(old, new, 1)
          path.write_text(source)
      - name: Validate source and redaction tests
        run: |
          npm ci
          npm run ci
      - name: Commit validated redaction repair
        shell: bash
        run: |
          rm -f .github/workflows/apply-v01411-redaction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && { echo 'No changes to commit'; exit 1; } || true
          git commit -m "Redact native integration setup secrets"
          git push origin HEAD:fix/v0.14.11-arm64-https
