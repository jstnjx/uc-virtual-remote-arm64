name: Apply multiarch documentation updates

on:
  push:
    branches:
      - feature/multiarch-ha

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-multiarch-docs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/multiarch-ha
      - name: Update installer and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          install = Path('install.sh')
          text = install.read_text()
          old = '''HOST_ARCH="$(uname -m)"
          if [ "$HOST_ARCH" != "aarch64" ] && [ "$HOST_ARCH" != "arm64" ]; then
            echo "==> Host architecture is $HOST_ARCH; checking ARM64 container emulation"
            if ! $SUDO docker run --rm --platform linux/arm64 alpine:3.22 /bin/true >/dev/null 2>&1; then
              echo "==> Enabling Linux ARM64 binfmt support"
              $SUDO docker run --privileged --rm tonistiigi/binfmt --install arm64 >/dev/null
              $SUDO docker run --rm --platform linux/arm64 alpine:3.22 /bin/true >/dev/null 2>&1 \\
                || fail "ARM64 container emulation could not be enabled on this host."
            fi
          fi

          '''
          if old not in text:
              raise SystemExit('installer ARM64 binfmt block not found')
          text = text.replace(old, '', 1)
          install.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          replacements = {
            '# UC Virtual Remote ARM64': '# UC Virtual Remote',
            'A compact ARM64 virtual Unfolded Circle Remote appliance. The Remote Core, Web Configurator, normal ARM64 custom integrations, and Docker-based external integrations all live inside one top-level container.': 'A compact multi-architecture virtual Unfolded Circle Remote appliance. The Remote Core, Web Configurator, normal ARM64 custom integrations, and Docker-based external integrations all live inside one top-level container.',
            '> UC Virtual Remote ARM64 is an independent community project. It is not affiliated with, endorsed by, operated by, or supported by Unfolded Circle ApS.': '> UC Virtual Remote is an independent community project. It is not affiliated with, endorsed by, operated by, or supported by Unfolded Circle ApS.',
            '### One ARM64 appliance container': '### One multi-architecture appliance container',
            '- ARM64-only UC Virtual Remote image\n- Works natively on ARM64 Linux hosts\n- Can run on x86-64 Linux with ARM64 binfmt/QEMU emulation': '- Multi-architecture image for ARM64 and AMD64 Linux hosts\n- Core, Web Configurator and internal Docker run natively on the host architecture\n- ARM64 UC integration binaries run directly on ARM64 and through bundled, process-scoped QEMU on AMD64',
            '- run directly inside the ARM64 appliance': '- run directly on ARM64; ARM64 ELF drivers use the bundled `qemu-aarch64-static` launcher on AMD64',
            'Source builds happen in the internal ARM64 Docker daemon, so generated images are ARM64. Prebuilt external images must provide an ARM64 variant.': 'Source builds happen in the internal Docker daemon for the host architecture. Prebuilt external images must provide a variant for that host architecture; on AMD64, an ARM64-only prebuilt image can fall back to a source build when the registry entry supports it.',
            'On x86-64 hosts the installer checks ARM64 container execution and installs the `arm64` binfmt handler when needed.': 'No host-wide ARM64 `binfmt_misc` handler is required. The AMD64 image contains its own scoped ARM64 userspace emulator for normal Remote integration binaries.',
            '└─ uc-virtual-remote-arm64           ARM64, privileged, host network': '└─ uc-virtual-remote-arm64           host-native, privileged, host network',
            'The Compose service explicitly targets `linux/arm64`.': 'The Compose service uses the multi-architecture image and automatically selects the host-native `linux/arm64` or `linux/amd64` variant.',
            'Validate the ARM64 appliance image with Buildx:': 'Validate both appliance image variants with Buildx:',
            'docker buildx build --platform linux/arm64 -t uc-virtual-remote-arm64:dev .': 'docker buildx build --platform linux/amd64,linux/arm64 -t uc-virtual-remote-arm64:dev .'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README anchor not found: {old[:80]}')
              text = text.replace(old, new, 1)
          readme.write_text(text)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install.sh README.md
          git commit -m "Document host-native multiarch runtime"
          git push origin HEAD:feature/multiarch-ha
